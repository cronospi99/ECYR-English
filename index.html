<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ECYR English</title>
    <meta name="description" content="Aprende inglés de A1 a C1: lecciones por nivel CEFR, lecturas, audios, juegos, simulador IELTS y coach con IA." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ecyr:theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
    <style>
      /* Intro curtain (from the IELTS Simulator): a full-bleed cover with a live
         percentage that leaves as five panels sweeping upward in a stagger. */
      .intro{position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:#0b1026;
        font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
      .intro-panels{position:absolute;inset:0;display:flex}
      .intro-panels span{flex:1;transform:translateY(0);transition:transform 1.05s cubic-bezier(.76,0,.24,1)}
      .intro-panels span:nth-child(1){background:#0b1026}.intro-panels span:nth-child(2){background:#0e1433}
      .intro-panels span:nth-child(3){background:#121a40}.intro-panels span:nth-child(4){background:#161e4a}
      .intro-panels span:nth-child(5){background:#1a2154}
      .intro-inner{position:relative;z-index:2;width:100%;max-width:1080px;padding:0 24px calc(46px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;
        justify-content:space-between;gap:24px;flex-wrap:wrap;transition:opacity .45s cubic-bezier(.25,.46,.45,.94),transform .45s cubic-bezier(.25,.46,.45,.94)}
      .intro-brand{display:flex;align-items:center;gap:16px;margin:0 0 26px;opacity:0;animation:introUp .8s cubic-bezier(.25,.46,.45,.94) .05s forwards}
      .intro-logo{width:auto;height:clamp(64px,9vw,92px);flex:none}
      .intro-word{display:flex;flex-direction:column;line-height:1;color:#fff}
      .intro-word b{font-weight:800;font-size:clamp(38px,6vw,62px);letter-spacing:-.02em}
      .intro-word span{font-weight:400;font-size:clamp(13px,1.7vw,18px);letter-spacing:.52em;margin-top:.45em;color:#dfe4ff;text-indent:.04em}
      .intro-eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8ea6ff;margin:0 0 8px;opacity:0;
        animation:introUp .8s cubic-bezier(.25,.46,.45,.94) .15s forwards}
      .intro-title{font-weight:800;font-size:clamp(40px,7vw,84px);line-height:1.02;letter-spacing:-.03em;color:#fff;margin:0;opacity:0;
        animation:introUp .9s cubic-bezier(.25,.46,.45,.94) .28s forwards}
      .intro-title em{font-style:normal;background:linear-gradient(135deg,#5b8bff,#a48bff);-webkit-background-clip:text;background-clip:text;color:transparent}
      .intro-count{font-weight:800;color:#fff;font-size:clamp(56px,11vw,120px);line-height:.9;letter-spacing:-.05em;display:flex;align-items:flex-start;
        font-variant-numeric:tabular-nums;opacity:0;animation:introUp .8s cubic-bezier(.25,.46,.45,.94) .4s forwards}
      .intro-count i{font-size:.32em;font-style:normal;margin-top:.35em;margin-left:.12em;opacity:.55}
      @keyframes introUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
      .intro-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:2}
      .intro-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f6bff,#7b5cff);transition:width .35s cubic-bezier(.25,.46,.45,.94)}
      .intro.is-leaving{background:transparent}
      .intro.is-leaving .intro-inner{opacity:0;transform:translateY(-22px)}
      .intro.is-leaving .intro-bar{opacity:0;transition:opacity .3s}
      .intro.is-leaving .intro-panels span{transform:translateY(-101%)}
      .intro.is-leaving .intro-panels span:nth-child(1){transition-delay:.02s}.intro.is-leaving .intro-panels span:nth-child(2){transition-delay:.08s}
      .intro.is-leaving .intro-panels span:nth-child(3){transition-delay:.14s}.intro.is-leaving .intro-panels span:nth-child(4){transition-delay:.2s}
      .intro.is-leaving .intro-panels span:nth-child(5){transition-delay:.26s}
      /* The app eases up behind the curtain as it lifts. */
      body.intro-active{overflow:hidden}
      body.intro-active #root{opacity:0;transform:translateY(26px) scale(.988)}
      body.intro-done #root{opacity:1;transform:none;transition:opacity .8s cubic-bezier(.25,.46,.45,.94),transform 1s cubic-bezier(.22,1,.36,1)}
      @media (prefers-reduced-motion:reduce){
        .intro-brand,.intro-eyebrow,.intro-title,.intro-count{animation:none;opacity:1}
        .intro-panels span,.intro-inner,.intro-bar span,body.intro-done #root{transition:none}
      }
    </style>
  </head>
  <body>
    <!-- Intro curtain: first in the body so it paints before anything else. -->
    <div id="intro" class="intro" role="status" aria-live="polite" aria-label="Cargando">
      <div class="intro-panels" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="intro-inner">
        <div class="intro-mark">
          <div class="intro-brand">
            <svg class="intro-logo" viewBox="0 0 500 540" aria-hidden="true"><defs> <linearGradient id="ig" x1="20" y1="330" x2="480" y2="190" gradientUnits="userSpaceOnUse"> <stop offset="0" stop-color="#0E70FF"/><stop offset=".4" stop-color="#3F6BFD"/><stop offset=".75" stop-color="#7552FB"/><stop offset="1" stop-color="#A962FD"/> </linearGradient> </defs> <g fill="url(#ig)"> <path d="M20 179Q20 147 52 147H90Q122 147 122 179V240H62Q30 240 20 256Z"/> <path d="M140 130Q140 100 170 100H205Q235 100 235 130V240H140Z"/> <path d="M255 90Q255 58 287 58H320Q352 58 352 90V240L303.5 290L255 240Z"/> <path d="M372 50Q372 18 404 18H441Q473 18 473 50V240H372Z"/> <path d="M20 420Q20 402 38 402H104Q122 402 122 420V502Q122 520 104 520H65Q20 520 20 475Z"/> <rect x="140" y="402" width="95" height="118" rx="18"/> <rect x="255" y="402" width="97" height="118" rx="18"/> <path d="M372 420Q372 402 390 402H455Q473 402 473 420V475Q473 520 428 520H390Q372 520 372 502Z"/> </g> <g fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linejoin="round"> <path d="M122 275H64Q37 275 37 302V341Q37 368 64 368H122M37 321.5H112"/> <path d="M238 275H190Q157 275 157 308V335Q157 368 190 368H238"/> <path d="M387 385V275H438Q470 275 470 307V313Q470 345 438 345H404"/> <path d="M428 345L458 380" stroke-linecap="round"/> </g> <path fill="#FFFFFF" d="M255 260L303.5 310L352 260V297L320 330V385H287V330L255 297Z"/></svg>
            <div class="intro-word"><b>ECYR</b><span>English</span></div>
          </div>
          <p class="intro-eyebrow">Teacher Esteban Yepes</p>
          <h1 class="intro-title"><em>Go For It!</em></h1>
        </div>
        <div class="intro-count"><span id="introPct">0</span><i>%</i></div>
      </div>
      <div class="intro-bar"><span id="introBar"></span></div>
    </div>
    <script>
      /* The percentage tracks REAL load milestones (parsing, webfonts, page load
         and the React app's first render) and eases toward them without ever
         going backwards. A floor stops a warm cache from flashing it; a ceiling
         guarantees nobody is ever trapped behind it. Once per tab session. */
      (function () {
        var intro = document.getElementById('intro');
        if (!intro) return;
        var seen = false;
        try { seen = sessionStorage.getItem('ecyr:intro-seen') === '1'; } catch (e) {}
        if (seen) { intro.parentNode.removeChild(intro); document.body.classList.add('intro-done'); return; }
        document.body.classList.add('intro-active');
        var pctEl = document.getElementById('introPct'), barEl = document.getElementById('introBar');
        var MIN_MS = 1100, MAX_MS = 7000, started = Date.now();
        var steps = { dom: 22, fonts: 18, load: 30, app: 30 }, done = {};
        function target() { var t = 0; for (var k in steps) if (done[k]) t += steps[k]; return t; }
        var shown = 0, finished = false, raf = null;
        function tick() {
          var goal = target();
          var drift = Math.min(goal, shown + 0.35);
          shown = Math.max(drift, shown + (goal - shown) * 0.08);
          if (shown > 99.4 && goal >= 100) shown = 100;
          var v = Math.min(100, Math.floor(shown));
          pctEl.textContent = v; barEl.style.width = v + '%';
          if (v >= 100 && Date.now() - started >= MIN_MS) { finish(); return; }
          raf = requestAnimationFrame(tick);
        }
        function finish() {
          if (finished) return;
          finished = true;
          if (raf) cancelAnimationFrame(raf);
          pctEl.textContent = '100'; barEl.style.width = '100%';
          try { sessionStorage.setItem('ecyr:intro-seen', '1'); } catch (e) {}
          setTimeout(function () {
            intro.classList.add('is-leaving');
            document.body.classList.remove('intro-active');
            document.body.classList.add('intro-done');
            setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 1500);
          }, 260);
        }
        function mark(k) { done[k] = true; }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { mark('dom'); });
        else mark('dom');
        if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { mark('fonts'); }); setTimeout(function () { mark('fonts'); }, 3000); }
        else mark('fonts');
        if (document.readyState === 'complete') mark('load'); else window.addEventListener('load', function () { mark('load'); });
        window.addEventListener('app:ready', function () { mark('app'); });
        setTimeout(function () { mark('app'); }, MAX_MS - 1200);
        setTimeout(finish, MAX_MS);
        raf = requestAnimationFrame(tick);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
