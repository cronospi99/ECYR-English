<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Too Good To Be True · Impostor words</title>
<script src="../_bridge/ecyr-bridge.js" data-slug="too-good-to-be-true"></script>
<script src="./impostor-words.js"></script>
<script src="../_arcade/loopmusic.js" data-tune="groove"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root { --bg:#07090E; --card:#121A2B; --line:#26324A; --ink:#F2F4F8; --dim:#9AA7BD; --blue:#3D8BFF; --red:#FF4D5E; --green:#2BD67B; --gold:#FFC83D; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: radial-gradient(120% 90% at 82% -10%, #16213A 0%, var(--bg) 62%); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
h1, h2, .big { font-family: 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -0.02em; }
.wrap { max-width: 1180px; margin: 0 auto; padding: clamp(14px, 3vw, 36px); padding-top: 64px; }
.kicker { font-weight: 800; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
h1 { font-size: clamp(36px, 6vw, 78px); line-height: .95; margin: 8px 0 12px; }
h1 span { color: var(--red); }
p.lead { color: #C8D1E0; font-size: clamp(15px, 1.5vw, 19px); max-width: 760px; line-height: 1.45; margin: 0 0 22px; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin: 18px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 10px 18px; font-weight: 800; font-size: 16px; }
.chip.on { background: var(--blue); border-color: var(--blue); }
.btn { border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 800; font-size: 18px; background: var(--red); color: #fff; box-shadow: 0 6px 0 #8E1E2A; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #8E1E2A; }
.btn.ghost { background: transparent; border: 2px solid var(--line); box-shadow: none; color: var(--ink); font-size: 15px; padding: 9px 16px; }
.btn.green { background: var(--green); color: #052; box-shadow: 0 6px 0 #148A4C; }
.btn.small { font-size: 15px; padding: 10px 18px; }
input.team { background: var(--card); border: 2px solid var(--line); color: var(--ink); border-radius: 12px; padding: 9px 12px; font: 700 15px inherit; width: 150px; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 26px; }
.how div { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; color: #C8D1E0; font-size: 14.5px; line-height: 1.4; }
.how b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.meta .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--ink); }
.meta .imp { background: var(--red); color: #fff; border-color: var(--red); }
.teams { display: flex; flex-wrap: wrap; gap: 8px; }
.team-box { border: 2px solid var(--line); border-radius: 14px; padding: 6px 12px; min-width: 110px; background: var(--card); }
.team-box.turn { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,200,61,.25); }
.team-box .n { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.team-box .s { font-family: 'Bricolage Grotesque'; font-size: 26px; font-weight: 800; line-height: 1; }
.turnline { font-size: clamp(16px, 1.8vw, 22px); font-weight: 700; margin: 4px 0 12px; color: #C8D1E0; }
.turnline b { color: var(--gold); }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 1.2vw, 14px); }
.card { position: relative; min-height: clamp(76px, 13vh, 120px); border-radius: 18px; border: 2px solid var(--line); background: linear-gradient(160deg, #18233A, #101828);
  color: var(--ink); padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: transform .12s, border-color .12s; }
.card:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--blue); }
.card .w { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(17px, 2.1vw, 30px); overflow-wrap: anywhere; line-height: 1.05; }
.card .t { font-size: clamp(11px, 1.05vw, 14px); color: var(--dim); margin-top: 4px; }
.card.fake { background: linear-gradient(160deg, #5A0F1A, #2A0910); border-color: var(--red); }
.card.real { background: linear-gradient(160deg, #0E3B25, #0A2218); border-color: var(--green); }
.card.sel { border-color: var(--gold); transform: scale(1.03); }
.card .tag { position: absolute; top: 6px; right: 8px; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
.card:disabled { cursor: default; }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
.card.flip { animation: pop .35s ease-out; }

.panel { margin-top: 14px; background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px 18px; }
.panel.bad { border-color: var(--gold); }
.panel.good { border-color: var(--red); }
.panel h2 { margin: 0 0 6px; font-size: clamp(20px, 2.4vw, 30px); }
.panel p { margin: 4px 0 12px; color: #C8D1E0; }
.key { color: var(--gold); font-weight: 700; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: 10px 0 14px; }
.list div { background: #0D1422; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 14px; }
.list .x { border-color: var(--red); }
.podium { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0 18px; }
.podium > div { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 12px 18px; min-width: 150px; }
.podium > div:first-child { border-color: var(--gold); }
@media (max-width: 640px) { .card .t { display: none; } .wrap { padding-top: 60px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  var LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
  var BANK = window.TGTBT_BANK;
  var SOLO = (function () { try { return new URLSearchParams(location.search).get('mode') === 'solo'; } catch (e) { return false; } })();
  var HIT = 100, MISS = 50;
  // Each new board: more impostors and more of them are look-alikes of real words.
  var IMPOSTORS = [3, 4, 5, 5, 6, 6, 7];
  var ALIKE = [0.2, 0.35, 0.5, 0.6, 0.7, 0.8, 0.9];
  var app = document.getElementById('app');

  var st = { phase: 'setup', level: 'B1', nTeams: SOLO ? 1 : 2, names: ['Team A', 'Team B', 'Team C', 'Team D'],
    teams: [], turn: 0, board: 0, cards: [], pending: null, used: {}, rep: null, found: 0, missed: 0 };
  try { var saved = JSON.parse(localStorage.getItem('tgtbt:setup') || 'null'); if (saved) { st.level = saved.level || st.level; st.nTeams = SOLO ? 1 : saved.nTeams || 2; st.names = saved.names || st.names; } } catch (e) {}

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function parseReal(s) { var p = s.split('|'); return { word: p[0], es: p[1], syn: p[2] || '' }; }
  // Pick fresh words first; once a list runs out, it is reused.
  function take(list, n, key) {
    var used = st.used[key] || (st.used[key] = {});
    var fresh = list.filter(function (x) { return !used[x]; });
    if (fresh.length < n) { st.used[key] = used = {}; fresh = list.slice(); }
    var out = shuffle(fresh).slice(0, n);
    out.forEach(function (x) { used[x] = 1; });
    return out;
  }

  function newBoard() {
    var b = BANK[st.level], k = Math.min(st.board, IMPOSTORS.length - 1);
    var nImp = IMPOSTORS[k], nAlike = Math.round(nImp * ALIKE[k]);
    var alike = take(b.alike, nAlike, st.level + 'a').map(function (s) { var p = s.split('|'); return { word: p[0], fake: true, alikeOf: p[1] }; });
    var fakes = take(b.fake, nImp - alike.length, st.level + 'f').map(function (w) { return { word: w, fake: true }; });
    var real = take(b.real, 16 - nImp, st.level + 'r').map(function (s) { var r = parseReal(s); r.fake = false; return r; });
    st.cards = shuffle(real.concat(fakes, alike)).map(function (c, i) { c.id = i; c.open = false; return c; });
    st.pending = null;
  }
  function impLeft() { return st.cards.filter(function (c) { return c.fake && !c.open; }).length; }
  function nImp() { return st.cards.filter(function (c) { return c.fake; }).length; }
  function nextTurn() { st.turn = (st.turn + 1) % st.teams.length; }
  function showEs() { return st.level === 'C1' || st.level === 'C2'; }

  function start() {
    try { localStorage.setItem('tgtbt:setup', JSON.stringify({ level: st.level, nTeams: st.nTeams, names: st.names })); } catch (e) {}
    st.teams = []; for (var i = 0; i < st.nTeams; i++) st.teams.push({ name: (st.names[i] || '').trim() || 'Team ' + 'ABCD'[i], score: 0, hits: 0, misses: 0, saves: 0 });
    if (st.nTeams === 1) st.teams[0].name = SOLO ? 'You' : 'The class';
    st.turn = 0; st.board = 0; st.used = {}; st.found = 0; st.missed = 0;
    newBoard(); st.phase = 'play';
    st.rep = { t0: Date.now() };
    window.ECYRBridge && window.ECYRBridge.start({ level: st.level, mode: SOLO ? 'solo' : 'class', meta: { teams: st.nTeams, game: 'impostor-words' } });
    render();
  }

  function pick(id) {
    var c = st.cards[id]; if (!c || c.open || st.pending) return;
    var team = st.teams[st.turn];
    c.open = true; c.flip = true;
    if (c.fake) {
      team.score += HIT; team.hits++; st.found++;
      window.ECYRBridge && window.ECYRBridge.answer(true, { topic: 'impostor', level: st.level });
      st.pending = { kind: 'hit', card: c, team: st.turn };
      nextTurn();
    } else {
      st.pending = { kind: 'real', card: c, team: st.turn, showKey: false };
    }
    render();
  }
  function judge(ok) {
    var p = st.pending; if (!p || p.kind !== 'real') return;
    var team = st.teams[p.team];
    if (ok) team.saves++; else { team.score -= MISS; team.misses++; }
    st.missed++;
    window.ECYRBridge && window.ECYRBridge.answer(false, { topic: 'impostor', level: st.level });
    st.pending = { kind: ok ? 'saved' : 'lost', card: p.card, team: p.team };
    nextTurn(); render();
  }
  function closePanel() { st.pending = null; if (!impLeft()) st.phase = 'board-done'; render(); }
  function nextBoard() { st.board++; newBoard(); st.phase = 'play'; render(); }
  function endGame(ask) {
    if (ask && !confirm('End the game now and see the results?')) return;
    st.phase = 'end';
    var asked = st.found + st.missed;
    window.ECYRBridge && window.ECYRBridge.end({ mode: SOLO ? 'solo' : 'class', level: st.level, asked: asked, correct: st.found,
      meta: { boards: st.board + 1, teams: st.teams.map(function (t) { return { name: t.name, score: t.score }; }), durationSec: Math.round((Date.now() - st.rep.t0) / 1000), game: 'impostor-words' } });
    render();
  }

  function setupView() {
    var lv = LEVELS.map(function (l) { return '<button class="chip' + (st.level === l ? ' on' : '') + '" data-lv="' + l + '">' + l + '</button>'; }).join('');
    var tn = SOLO ? '' : '<div class="label">Teams</div><div class="row">' + [1, 2, 3, 4].map(function (n) {
      return '<button class="chip' + (st.nTeams === n ? ' on' : '') + '" data-nt="' + n + '">' + (n === 1 ? 'Whole class' : n + ' teams') + '</button>';
    }).join('') + '</div>' + (st.nTeams > 1 ? '<div class="row" style="margin-top:10px">' + st.names.slice(0, st.nTeams).map(function (n, i) {
      return '<input class="team" data-tn="' + i + '" value="' + esc(n) + '" aria-label="Team ' + (i + 1) + ' name" maxlength="18">';
    }).join('') + '</div>' : '');
    return '<div class="kicker">Impostor words · English A1 → C2</div>' +
      '<h1>Too good<br><span>to be true</span></h1>' +
      '<p class="lead">16 words appear on the board. Some of them are impostors: invented words, or fakes that look a lot like real English words. Find them all!</p>' +
      '<div class="label">Level</div><div class="row">' + lv + '</div>' + tn +
      '<div class="row" style="margin-top:24px"><button class="btn" data-act="start">Let’s play</button></div>' +
      '<div class="how">' +
      '<div><b>1 · Spot an impostor</b>On your turn, tap the word you think is invented. Right? +' + HIT + ' points.</div>' +
      '<div><b>2 · Wrong? Save yourself</b>If the word is real, say a synonym. Good synonym: no points lost. No synonym: −' + MISS + '.</div>' +
      '<div><b>3 · Every board gets trickier</b>The game ends when all the impostors are found. The next board has more impostors that look like real words.</div>' +
      '<div><b>C1 · C2</b>Academic words, with their Spanish translation when they are revealed.</div>' +
      '</div>';
  }

  function boardView() {
    var teams = st.teams.map(function (t, i) {
      return '<div class="team-box' + (i === st.turn && st.teams.length > 1 ? ' turn' : '') + '"><div class="n">' + esc(t.name) + '</div><div class="s">' + t.score + '</div></div>';
    }).join('');
    var cards = st.cards.map(function (c) {
      var cls = 'card' + (c.open ? (c.fake ? ' fake' : ' real') : '') + (c.flip ? ' flip' : '') + (st.pending && st.pending.card === c ? ' sel' : '');
      var sub = '';
      if (c.open && c.fake) sub = c.alikeOf ? 'fake · looks like “' + esc(c.alikeOf) + '”' : 'invented';
      else if (c.open && showEs()) sub = esc(c.es);
      else if (c.open) sub = 'real word';
      return '<button class="' + cls + '" data-card="' + c.id + '"' + (c.open || st.pending ? ' disabled' : '') + '>' +
        (c.open ? '<span class="tag">' + (c.fake ? '🚨' : '✓') + '</span>' : '') +
        '<span class="w">' + esc(c.word) + '</span>' + (sub ? '<span class="t">' + sub + '</span>' : '') + '</button>';
    }).join('');
    st.cards.forEach(function (c) { c.flip = false; });
    var t = st.teams[st.turn];
    var turn = st.teams.length > 1 ? '<b>' + esc(t.name) + '</b>, your turn: which word is an impostor?' : 'Which word is an impostor?';
    return '<div class="top"><div class="meta"><span class="pill">Level ' + st.level + '</span><span class="pill">Board ' + (st.board + 1) + '</span>' +
      '<span class="pill imp">' + impLeft() + ' of ' + nImp() + ' impostors left</span></div>' +
      '<div class="row"><div class="teams">' + teams + '</div><button class="btn ghost" data-act="end">End game</button></div></div>' +
      '<div class="turnline">' + turn + '</div>' +
      '<div class="board">' + cards + '</div>' + panelView();
  }

  function panelView() {
    var p = st.pending; if (!p) return '';
    var c = p.card, who = esc(st.teams[p.team].name), es = showEs() && !c.fake ? ' <span class="key">(' + esc(c.es) + ')</span>' : '';
    if (p.kind === 'hit') return '<div class="panel good"><h2>🚨 Impostor caught! +' + HIT + '</h2><p>“' + esc(c.word) + '” is ' +
      (c.alikeOf ? 'not a real word: it imitates “<b>' + esc(c.alikeOf) + '</b>”.' : 'an invented word.') + (st.teams.length > 1 ? ' Well done, ' + who + '!' : '') + '</p>' +
      '<button class="btn small" data-act="ok">' + (impLeft() ? 'Continue' : 'See the board') + '</button></div>';
    if (p.kind === 'real') return '<div class="panel bad"><h2>“' + esc(c.word) + '” is a real word!' + es + '</h2>' +
      '<p>' + (st.teams.length > 1 ? who + ', say' : 'Say') + ' a synonym (a word that means the same) to keep your points.</p>' +
      '<p>' + (p.showKey ? 'Possible synonyms: <span class="key">' + esc(c.syn) + '</span>' : '<button class="btn ghost" data-act="key">Show possible synonyms (teacher)</button>') + '</p>' +
      '<div class="row"><button class="btn green small" data-act="saved">✓ Good synonym · no points lost</button><button class="btn small" data-act="lost">✗ No synonym · −' + MISS + '</button></div></div>';
    return '<div class="panel"><h2>' + (p.kind === 'saved' ? '😮‍💨 Saved!' : '−' + MISS + ' points') + '</h2><p>“' + esc(c.word) + '”' + es + ' — synonyms: <span class="key">' + esc(c.syn) + '</span></p>' +
      '<button class="btn small" data-act="ok">Continue</button></div>';
  }

  function reviewList() {
    return '<div class="list">' + st.cards.map(function (c) {
      return c.fake ? '<div class="x">🚨 <b>' + esc(c.word) + '</b> — ' + (c.alikeOf ? 'fake (real: ' + esc(c.alikeOf) + ')' : 'invented') + '</div>'
        : '<div>✓ <b>' + esc(c.word) + '</b> — ' + esc(c.es) + '<br><span style="color:#9AA7BD">≈ ' + esc(c.syn) + '</span></div>';
    }).join('') + '</div>';
  }
  function ranking() {
    return '<div class="podium">' + st.teams.slice().sort(function (a, b) { return b.score - a.score; }).map(function (t, i) {
      return '<div><div class="kicker" style="color:' + (i ? '#9AA7BD' : '#FFC83D') + '">' + (i ? '#' + (i + 1) : '🏆 #1') + '</div><div class="big" style="font-size:22px;font-weight:800">' + esc(t.name) +
        '</div><div>' + t.score + ' pts · ' + t.hits + ' impostors · ' + t.saves + ' saves</div></div>';
    }).join('') + '</div>';
  }
  function doneView() {
    var k = Math.min(st.board + 1, IMPOSTORS.length - 1);
    return '<div class="kicker">Board ' + (st.board + 1) + ' complete</div><h1 style="font-size:clamp(30px,4.5vw,56px)">All the impostors are out! 🎉</h1>' +
      ranking() + '<div class="label">The board</div>' + reviewList() +
      '<div class="row"><button class="btn" data-act="next">Next board · ' + IMPOSTORS[k] + ' impostors, trickier</button><button class="btn ghost" data-act="end">End game</button></div>';
  }
  function endView() {
    var w = st.teams.slice().sort(function (a, b) { return b.score - a.score; });
    var title = st.teams.length === 1 ? 'Great job!' : (w[0].score === w[1].score ? 'It’s a draw!' : esc(w[0].name) + ' wins!');
    return '<div class="kicker">Level ' + st.level + ' · ' + (st.board + 1) + (st.board ? ' boards' : ' board') + ' · ' + st.found + ' impostors caught</div>' +
      '<h1 style="font-size:clamp(32px,5vw,64px)">' + title + '</h1>' + ranking() +
      '<div class="label">Last board</div>' + reviewList() +
      '<div class="row"><button class="btn" data-act="again">Play again</button><button class="btn ghost" data-act="setup">Change level or teams</button></div>';
  }

  function render() {
    app.innerHTML = st.phase === 'setup' ? setupView() : st.phase === 'play' ? boardView() : st.phase === 'board-done' ? doneView() : endView();
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('button'); if (!el) return;
    if (el.dataset.lv) { st.level = el.dataset.lv; render(); }
    else if (el.dataset.nt) { st.nTeams = Number(el.dataset.nt); render(); }
    else if (el.dataset.card) pick(Number(el.dataset.card));
    else switch (el.dataset.act) {
      case 'start': case 'again': start(); break;
      case 'setup': st.phase = 'setup'; render(); break;
      case 'ok': closePanel(); break;
      case 'key': st.pending.showKey = true; render(); break;
      case 'saved': judge(true); break;
      case 'lost': judge(false); break;
      case 'next': nextBoard(); break;
      case 'end': endGame(st.phase === 'play'); break;
    }
  });
  app.addEventListener('input', function (e) { var i = e.target.dataset && e.target.dataset.tn; if (i != null) st.names[Number(i)] = e.target.value; });
  window.addEventListener('pagehide', function () { if (st.phase === 'play' && st.found + st.missed > 0) endGame(false); });
  render();
})();
</script>
</body>
</html>
