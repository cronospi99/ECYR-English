<style>

@keyframes think { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.01, 1.016) rotate(-.7deg); } }
@keyframes floaty { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.8%) rotate(1.1deg); } }

@keyframes sway { 0%, 100% { transform: rotate(-1.7deg); } 50% { transform: rotate(2.3deg); } }

/* Start: the mind-blown emoji really blows, the screen goes white, the board appears. */
@keyframes boom { 0% { transform: scale(1); } 18% { transform: scale(.9, .86) translateY(3%); } 32% { transform: scale(1.12) rotate(-5deg); } 44% { transform: scale(1.05) rotate(5deg); } 100% { transform: scale(2.3) translateY(-6%); } }
@keyframes shake { 0%, 100% { transform: translate(0); } 20% { transform: translate(-7px, 4px); } 40% { transform: translate(6px, -5px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(4px, 5px); } }
@keyframes puff { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--s)); opacity: 0; } }
.scene.boom .ly-emoji { animation: boom .95s cubic-bezier(.3, .1, .3, 1) forwards; z-index: 5; }
.hero.boom { animation: shake .45s linear .3s; }
.puff { position: absolute; left: 49.6%; top: 14%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #E9DDF6 70%); opacity: 0; animation: puff .8s cubic-bezier(.2, .6, .3, 1) .28s forwards; z-index: 6; }
.puff.spark { width: 2.2%; background: #FFD23D; box-shadow: 0 0 12px #FFB300; }
#flash, #fade { position: fixed; inset: 0; z-index: 9000; pointer-events: none; opacity: 0; }

#fade { background: #000; transition: opacity .6s ease; }

@media (max-width: 900px) { .hero { grid-template-columns: 1fr; padding: 60px 16px 0; min-height: 0; } .hero .logo { margin-left: -12px; width: min(100%, 420px); }
  .scene { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 12%, #000 88%, transparent); mask-image: linear-gradient(180deg, transparent 0, #000 12%, #000 88%, transparent); margin-top: 8px; } }
@media (prefers-reduced-motion: reduce) { .scene *, .hero { animation: none !important; } }

.end { text-align: center; }
.end h1 { margin-top: 6px; }
.pod { display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 2vw, 22px); margin: 26px auto 8px; max-width: 860px; min-height: 330px; }
.pod .p { flex: 1 1 0; max-width: 210px; display: flex; flex-direction: column; align-items: center; }
.pod .nm { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(16px, 2.2vw, 26px); overflow-wrap: anywhere; line-height: 1.05; }
.pod .sc { color: var(--gold); font-weight: 800; font-size: clamp(15px, 1.8vw, 22px); margin: 2px 0 8px; }
.pod .st { font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }
.pod .medal { font-size: clamp(34px, 5vw, 60px); line-height: 1; margin-bottom: 4px; }
@keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes drop { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: none; } }
.pod .blk { width: 100%; border-radius: 16px 16px 0 0; transform-origin: bottom; animation: rise .7s cubic-bezier(.2, .9, .3, 1.15) both; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px;
  font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(30px, 4vw, 52px); color: rgba(255,255,255,.92); box-shadow: inset 0 6px 0 rgba(255,255,255,.22); }
.pod .info { animation: drop .5s ease-out both; }
.pod .r1 .blk { height: 210px; background: linear-gradient(180deg, #FFC83D, #E08A00); animation-delay: 1.5s; } .pod .r1 .info { animation-delay: 2.1s; }
.pod .r2 .blk { height: 150px; background: linear-gradient(180deg, #C9D3E6, #8491AD); animation-delay: .9s; } .pod .r2 .info { animation-delay: 1.4s; }
.pod .r3 .blk { height: 108px; background: linear-gradient(180deg, #E79A62, #A85A28); animation-delay: .4s; } .pod .r3 .info { animation-delay: .9s; }
.pod .r4 .blk { height: 70px; background: linear-gradient(180deg, #5B4A99, #3B2C73); animation-delay: .1s; } .pod .r4 .info { animation-delay: .5s; }
.podfloor { height: 8px; max-width: 900px; margin: 0 auto 18px; border-radius: 99px; background: linear-gradient(90deg, transparent, #6C56C2, transparent); }
@keyframes confetti { 0% { transform: translateY(-10vh) rotate(0); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: .9; } }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti i { position: absolute; top: 0; width: 10px; height: 16px; border-radius: 3px; animation: confetti linear both; }
details.rev { text-align: left; margin: 6px 0 16px; } details.rev summary { cursor: pointer; font-weight: 800; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
.end .row { justify-content: center; }
@media (max-width: 640px) { .card .t { display: none; } .wrap { padding-top: 60px; } }

<script>
(function () {
  var LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
  var BANK = window.TGTBT_BANK;
  var SOLO = (function () { try { return new URLSearchParams(location.search).get('mode') === 'solo'; } catch (e) { return false; } })();
  var HIT = 100, MISS = 50;
  var FAKES = ['auto', 3, 4, 5, 6, 8], BOARDS = [1, 2, 3, 4, 5];
  var SCENE = '<img class="base" src="tgtbt/scene.webp" alt=""><img class="ly ly-purple" src="tgtbt/purple.webp" alt="" style="left:0.0%;top:51.541%;width:14.0%;height:37.238%"><img class="ly ly-green" src="tgtbt/green.webp" alt="" style="left:77.92%;top:57.707%;width:20.24%;height:21.578%"><div class="grp grp-blue"><img class="ly ly-blue" src="tgtbt/blue.webp" alt="" style="left:10.64%;top:30.703%;width:37.84%;height:57.83%"><img class="ly ly-mag" src="tgtbt/mag.webp" alt="" style="left:31.04%;top:45.869%;width:16.48%;height:38.964%"></div><img class="ly ly-red" src="tgtbt/red.webp" alt="" style="left:46.64%;top:41.06%;width:33.04%;height:47.472%"><img class="ly ly-card1" src="tgtbt/card1.webp" alt="" style="left:10.88%;top:3.699%;width:24.16%;height:27.25%"><img class="ly ly-card2" src="tgtbt/card2.webp" alt="" style="left:65.52%;top:3.946%;width:24.08%;height:27.99%"><img class="ly ly-card3" src="tgtbt/card3.webp" alt="" style="left:67.68%;top:30.333%;width:20.8%;height:18.866%"><img class="ly ly-sparkL" src="tgtbt/sparkL.webp" alt="" style="left:30.16%;top:27.127%;width:8.24%;height:13.687%"><img class="ly ly-sparkR" src="tgtbt/sparkR.webp" alt="" style="left:61.36%;top:22.935%;width:8.24%;height:14.673%"><img class="ly ly-qm" src="tgtbt/qm.webp" alt="" style="left:74.16%;top:44.513%;width:15.76%;height:19.605%"><img class="ly ly-emoji" src="tgtbt/emoji.webp" alt="" style="left:33.84%;top:0.0%;width:31.6%;height:48.212%">';
  var flash = document.getElementById('flash'), fade = document.getElementById('fade');
  var app = document.getElementById('app');

  var st = { phase: 'setup', level: 'B1', nTeams: SOLO ? 1 : 2, names: ['Team A', 'Team B', 'Team C', 'Team D'],
    fakes: 'auto', boards: 3, teams: [], turn: 0, board: 0, cards: [], pending: null, used: {}, rep: null, found: 0, missed: 0 };
  try { var saved = JSON.parse(localStorage.getItem('tgtbt:setup') || 'null'); if (saved) { st.level = saved.level || st.level; st.nTeams = SOLO ? 1 : saved.nTeams || 2; st.names = saved.names || st.names;
    if (FAKES.indexOf(saved.fakes) >= 0) st.fakes = saved.fakes; if (BOARDS.indexOf(saved.boards) >= 0) st.boards = saved.boards; } } catch (e) {}

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function parseReal(s) { var p = s.split('|'); return { word: p[0], es: p[1], syn: p[2] || '' }; }
  // Pick fresh words first; once a list runs out, it is reused.
  function take(list, n, key) {
    var used = st.used[key] || (st.used[key] = {});
    var fresh = list.filter(function (x) { return !used[x]; });
    if (fresh.length < n) { st.used[key] = used = {}; fresh = list.slice(); }
    var out = shuffle(fresh).slice(0, n);
    out.forEach(function (x) { used[x] = 1; });
    return out;
  }

  // How far into the game a board is (0 → 1): later boards have more impostors and more look-alikes of real words.
  function progress(k) { return st.boards > 1 ? Math.min(1, k / (st.boards - 1)) : 0.6; }
  function impFor(k) { return st.fakes === 'auto' ? Math.round(3 + 4 * progress(k)) : st.fakes; }
  function lastBoard() { return st.board + 1 >= st.boards; }
  function newBoard() {
    var b = BANK[st.level], nImp = impFor(st.board), nAlike = Math.round(nImp * (0.3 + 0.6 * progress(st.board)));
    var alike = take(b.alike, nAlike, st.level + 'a').map(function (s) { var p = s.split('|'); return { word: p[0], fake: true, alikeOf: p[1] }; });
    var fakes = take(b.fake, nImp - alike.length, st.level + 'f').map(function (w) { return { word: w, fake: true }; });
    var real = take(b.real, 16 - nImp, st.level + 'r').map(function (s) { var r = parseReal(s); r.fake = false; return r; });
    st.cards = shuffle(real.concat(fakes, alike)).map(function (c, i) { c.id = i; c.open = false; return c; });
    st.pending = null;
  }
  function impLeft() { return st.cards.filter(function (c) { return c.fake && !c.open; }).length; }
  function nImp() { return st.cards.filter(function (c) { return c.fake; }).length; }
  function nextTurn() { st.turn = (st.turn + 1) % st.teams.length; }
  function showEs() { return st.level === 'C1' || st.level === 'C2'; }

  function start() {
    try { localStorage.setItem('tgtbt:setup', JSON.stringify({ level: st.level, nTeams: st.nTeams, names: st.names, fakes: st.fakes, boards: st.boards })); } catch (e) {}
    st.teams = []; for (var i = 0; i < st.nTeams; i++) st.teams.push({ name: (st.names[i] || '').trim() || 'Team ' + 'ABCD'[i], score: 0, hits: 0, misses: 0, saves: 0 });
    if (st.nTeams === 1) st.teams[0].name = SOLO ? 'You' : 'The class';
    st.turn = 0; st.board = 0; st.used = {}; st.found = 0; st.missed = 0;
    newBoard(); st.phase = 'play';
    st.rep = { t0: Date.now() };
    window.ECYRBridge && window.ECYRBridge.start({ level: st.level, mode: SOLO ? 'solo' : 'class', meta: { teams: st.nTeams, boards: st.boards, fakes: st.fakes, game: 'impostor-words' } });
    render();
  }

  function pick(id) {
    var c = st.cards[id]; if (!c || c.open || st.pending) return;
    var team = st.teams[st.turn];
    c.open = true; c.flip = true;
    if (c.fake) {
      team.score += HIT; team.hits++; st.found++;
      window.ECYRBridge && window.ECYRBridge.answer(true, { topic: 'impostor', level: st.level });
      st.pending = { kind: 'hit', card: c, team: st.turn };
      nextTurn();
    } else {
      st.pending = { kind: 'real', card: c, team: st.turn, showKey: false };
    }
    render();
  }
  function judge(ok) {
    var p = st.pending; if (!p || p.kind !== 'real') return;
    var team = st.teams[p.team];
    if (ok) team.saves++; else { team.score -= MISS; team.misses++; }
    st.missed++;
    window.ECYRBridge && window.ECYRBridge.answer(false, { topic: 'impostor', level: st.level });
    st.pending = { kind: ok ? 'saved' : 'lost', card: p.card, team: p.team };
    nextTurn(); render();
  }
  function closePanel() { st.pending = null; if (!impLeft()) st.phase = 'board-done'; render(); }
  function nextBoard() { st.board++; newBoard(); st.phase = 'play'; render(); }
  function endGame(ask, instant) {
    if (ask && !confirm('End the game now and see the results?')) return;
    if (!instant) { curtain(function () { endGame(false, true); }); return; }
    st.phase = 'end';
    var asked = st.found + st.missed;
    window.ECYRBridge && window.ECYRBridge.end({ mode: SOLO ? 'solo' : 'class', level: st.level, asked: asked, correct: st.found,
      meta: { boards: st.board + 1, teams: st.teams.map(function (t) { return { name: t.name, score: t.score }; }), durationSec: Math.round((Date.now() - st.rep.t0) / 1000), game: 'impostor-words' } });
    render();
  }

  // "Let's play": the emoji's head blows, the screen flashes white and the board is there when it clears.
  var busy = false;
  function boomSound() {
    try {
      if (window.ArcadeMusic && !window.ArcadeMusic.isOn()) return;
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      var c = new AC(), t = c.currentTime + 0.28, o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.5);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.65);
      var b = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      var n = c.createBufferSource(), ng = c.createGain(); n.buffer = b; ng.gain.value = 0.28; n.connect(ng); ng.connect(c.destination); n.start(t);
      setTimeout(function () { c.close(); }, 1600);
    } catch (e) { /* no sound */ }
  }
  function launch() {
    if (busy) return; busy = true;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var scene = document.getElementById('scene'), hero = document.querySelector('.hero');
    if (!scene || reduce) { start(); busy = false; return; }
    for (var i = 0; i < 22; i++) {
      var a = Math.random() * Math.PI * 2, r = 90 + Math.random() * 260, el = document.createElement('i');
      el.className = 'puff' + (i % 3 === 2 ? ' spark' : '');
      el.style.setProperty('--dx', Math.round(Math.cos(a) * r) + 'px'); el.style.setProperty('--dy', Math.round(Math.sin(a) * r * 0.8 - 60) + 'px');
      el.style.setProperty('--s', (1.4 + Math.random() * 2.4).toFixed(2)); el.style.animationDelay = (0.26 + Math.random() * 0.14).toFixed(2) + 's';
      scene.appendChild(el);
    }
    scene.classList.add('boom'); hero.classList.add('boom'); boomSound();
    setTimeout(function () { flash.className = 'on'; }, 480);
    setTimeout(function () { start(); window.scrollTo(0, 0); flash.className = 'out'; busy = false; }, 980);
  }
  // The end: the screen goes black, then the podium lights up.
  function curtain(then) {
    if (busy) return; busy = true;
    fade.className = 'on';
    setTimeout(function () { then(); window.scrollTo(0, 0); fade.className = 'out'; busy = false; }, 700);
  }

  function setupView() {
    var lv = LEVELS.map(function (l) { return '<button class="chip' + (st.level === l ? ' on' : '') + '" data-lv="' + l + '">' + l + '</button>'; }).join('');
    var tn = SOLO ? '' : '<div class="label">Teams</div><div class="row">' + [1, 2, 3, 4].map(function (n) {
      return '<button class="chip' + (st.nTeams === n ? ' on' : '') + '" data-nt="' + n + '">' + (n === 1 ? 'Whole class' : n + ' teams') + '</button>';
    }).join('') + '</div>' + (st.nTeams > 1 ? '<div class="row" style="margin-top:10px">' + st.names.slice(0, st.nTeams).map(function (n, i) {
      return '<input class="team" data-tn="' + i + '" value="' + esc(n) + '" aria-label="Team ' + (i + 1) + ' name" maxlength="18">';
    }).join('') + '</div>' : '');
    var fk = FAKES.map(function (n) { return '<button class="chip wide' + (st.fakes === n ? ' on' : '') + '" data-fk="' + n + '">' + (n === 'auto' ? 'Rising 3 → 7' : n) + '</button>'; }).join('');
    var bd = BOARDS.map(function (n) { return '<button class="chip' + (st.boards === n ? ' on' : '') + '" data-bd="' + n + '">' + n + '</button>'; }).join('');
    return '<div class="hero"><div class="col"><div class="kicker">Impostor words · English A1 – C2</div>' +
      '<img class="logo" src="tgtbt/logo.webp" width="590" height="258" alt="Too Good to Be True — Impostor Words">' +
      '<p class="lead">16 words appear on the board. Some of them are impostors: invented words, or fakes that look a lot like real English words. Find them all!</p>' +
      '<div class="label">Level</div><div class="row">' + lv + '</div>' + tn +
      '<div class="label">Impostors per board</div><div class="row">' + fk + '</div>' +
      '<div class="label">Boards in this game</div><div class="row">' + bd + '</div>' +
      '<button class="btn play" data-act="start">Let’s play</button></div>' +
      '<div class="scene" id="scene" aria-hidden="true">' + SCENE + '</div></div>' +
      '<div class="wrap" style="padding-top:8px"><div class="how">' +
      '<div><b>1 · Spot an impostor</b>On your turn, tap the word you think is invented. Right? +' + HIT + ' points.</div>' +
      '<div><b>2 · Wrong? Save yourself</b>If the word is real, say a synonym. Good synonym: no points lost. No synonym: −' + MISS + '.</div>' +
      '<div><b>3 · Every board gets trickier</b>A board ends when all its impostors are found. Later boards hide more fakes that look like real words.</div>' +
      '<div><b>4 · The podium</b>After the last board the winner goes up on the podium. C1 · C2 use academic words with their Spanish translation.</div>' +
      '</div></div>';
  }

  function boardView() {
    var teams = st.teams.map(function (t, i) {
      return '<div class="team-box' + (i === st.turn && st.teams.length > 1 ? ' turn' : '') + '"><div class="n">' + esc(t.name) + '</div><div class="s">' + t.score + '</div></div>';
    }).join('');
    var cards = st.cards.map(function (c) {
      var cls = 'card' + (c.open ? (c.fake ? ' fake' : ' real') : '') + (c.flip ? ' flip' : '') + (st.pending && st.pending.card === c ? ' sel' : '');
      var sub = '';
      if (c.open && c.fake) sub = c.alikeOf ? 'fake · looks like “' + esc(c.alikeOf) + '”' : 'invented';
      else if (c.open && showEs()) sub = esc(c.es);
      else if (c.open) sub = 'real word';
      return '<button class="' + cls + '" data-card="' + c.id + '"' + (c.open || st.pending ? ' disabled' : '') + '>' +
        (c.open ? '<span class="tag">' + (c.fake ? '🚨' : '✓') + '</span>' : '') +
        '<span class="w">' + esc(c.word) + '</span>' + (sub ? '<span class="t">' + sub + '</span>' : '') + '</button>';
    }).join('');
    st.cards.forEach(function (c) { c.flip = false; });
    var t = st.teams[st.turn];
    var turn = st.teams.length > 1 ? '<b>' + esc(t.name) + '</b>, your turn: which word is an impostor?' : 'Which word is an impostor?';
    return '<div class="top"><div class="meta"><span class="pill">Level ' + st.level + '</span><span class="pill">Board ' + (st.board + 1) + ' of ' + st.boards + '</span>' +
      '<span class="pill imp">' + impLeft() + ' of ' + nImp() + ' impostors left</span></div>' +
      '<div class="row"><div class="teams">' + teams + '</div><button class="btn ghost" data-act="end">End game</button></div></div>' +
      '<div class="turnline">' + turn + '</div>' +
      '<div class="board">' + cards + '</div>' + panelView();
  }

  function panelView() {
    var p = st.pending; if (!p) return '';
    var c = p.card, who = esc(st.teams[p.team].name), es = showEs() && !c.fake ? ' <span class="key">(' + esc(c.es) + ')</span>' : '';
    if (p.kind === 'hit') return '<div class="panel good"><h2>🚨 Impostor caught! +' + HIT + '</h2><p>“' + esc(c.word) + '” is ' +
      (c.alikeOf ? 'not a real word: it imitates “<b>' + esc(c.alikeOf) + '</b>”.' : 'an invented word.') + (st.teams.length > 1 ? ' Well done, ' + who + '!' : '') + '</p>' +
      '<button class="btn small" data-act="ok">' + (impLeft() ? 'Continue' : 'See the board') + '</button></div>';
    if (p.kind === 'real') return '<div class="panel bad"><h2>“' + esc(c.word) + '” is a real word!' + es + '</h2>' +
      '<p>' + (st.teams.length > 1 ? who + ', say' : 'Say') + ' a synonym (a word that means the same) to keep your points.</p>' +
      '<p>' + (p.showKey ? 'Possible synonyms: <span class="key">' + esc(c.syn) + '</span>' : '<button class="btn ghost" data-act="key">Show possible synonyms (teacher)</button>') + '</p>' +
      '<div class="row"><button class="btn green small" data-act="saved">✓ Good synonym · no points lost</button><button class="btn small" data-act="lost">✗ No synonym · −' + MISS + '</button></div></div>';
    return '<div class="panel"><h2>' + (p.kind === 'saved' ? '😮‍💨 Saved!' : '−' + MISS + ' points') + '</h2><p>“' + esc(c.word) + '”' + es + ' — synonyms: <span class="key">' + esc(c.syn) + '</span></p>' +
      '<button class="btn small" data-act="ok">Continue</button></div>';
  }

  function reviewList() {
    return '<div class="list">' + st.cards.map(function (c) {
      return c.fake ? '<div class="x">🚨 <b>' + esc(c.word) + '</b> — ' + (c.alikeOf ? 'fake (real: ' + esc(c.alikeOf) + ')' : 'invented') + '</div>'
        : '<div>✓ <b>' + esc(c.word) + '</b> — ' + esc(c.es) + '<br><span style="color:#9AA7BD">≈ ' + esc(c.syn) + '</span></div>';
    }).join('') + '</div>';
  }
  function sorted() { return st.teams.slice().sort(function (a, b) { return b.score - a.score; }); }
  function ranking() {
    return '<div class="podium" style="display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 18px">' + sorted().map(function (t, i) {
      return '<div style="background:var(--card);border:2px solid ' + (i ? 'var(--line)' : 'var(--gold)') + ';border-radius:18px;padding:12px 18px;min-width:150px"><div class="kicker" style="color:' + (i ? '#B3A6D9' : '#FFC83D') + '">' + (i ? '#' + (i + 1) : '🏆 #1') + '</div><div class="big" style="font-size:22px;font-weight:800">' + esc(t.name) +
        '</div><div>' + t.score + ' pts · ' + t.hits + ' impostors · ' + t.saves + ' saves</div></div>';
    }).join('') + '</div>';
  }
  function doneView() {
    var next = lastBoard() ? '<button class="btn" data-act="finish">See the winner 🏆</button>'
      : '<button class="btn" data-act="next">Next board (' + (st.board + 2) + ' of ' + st.boards + ') · ' + impFor(st.board + 1) + ' impostors</button><button class="btn ghost" data-act="end">End game</button>';
    return '<div class="wrap"><div class="kicker">Board ' + (st.board + 1) + ' of ' + st.boards + ' complete</div><h1 style="font-size:clamp(30px,4.5vw,56px)">All the impostors are out! 🎉</h1>' +
      ranking() + '<div class="label">The board</div>' + reviewList() + '<div class="row">' + next + '</div></div>';
  }
  function podium() {
    var w = sorted(), medals = ['🏆', '🥈', '🥉', ''];
    // Classic podium order: 2nd, 1st, 3rd (4th at the end).
    var order = w.length === 1 ? [0] : w.length === 2 ? [1, 0] : w.length === 3 ? [1, 0, 2] : [1, 0, 2, 3];
    return '<div class="pod">' + order.map(function (k) {
      var t = w[k];
      return '<div class="p r' + (k + 1) + '"><div class="info"><div class="medal">' + medals[k] + '</div><div class="nm">' + esc(t.name) + '</div><div class="sc">' + t.score + ' pts</div>' +
        '<div class="st">' + t.hits + ' impostors · ' + t.saves + ' saves</div></div><div class="blk">' + (k + 1) + '</div></div>';
    }).join('') + '</div><div class="podfloor"></div>';
  }
  function confetti() {
    var cols = ['#FFC83D', '#FF4D5E', '#3D8BFF', '#2BD67B', '#C77DFF', '#fff'], out = '';
    for (var i = 0; i < 70; i++) out += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + cols[i % cols.length] + ';animation-duration:' + (2.6 + Math.random() * 2.6).toFixed(2) + 's;animation-delay:' + (2 + Math.random() * 2.5).toFixed(2) + 's;animation-iteration-count:3"></i>';
    return '<div class="confetti">' + out + '</div>';
  }
  function endView() {
    var w = sorted();
    var title = st.teams.length === 1 ? 'Great job!' : (w[0].score === w[1].score ? 'It’s a draw!' : esc(w[0].name) + ' wins!');
    var played = Math.min(st.board + 1, st.boards);
    return confetti() + '<div class="wrap end"><div class="kicker">Level ' + st.level + ' · ' + played + (played > 1 ? ' boards' : ' board') + ' · ' + st.found + ' impostors caught</div>' +
      '<h1 style="font-size:clamp(32px,5vw,64px)">' + title + '</h1>' + podium() +
      '<details class="rev"><summary>The last board: words, Spanish and synonyms</summary>' + reviewList() + '</details>' +
      '<div class="row"><button class="btn" data-act="again">Play again</button><button class="btn ghost" data-act="setup">Change level, teams or boards</button></div></div>';
  }

  function render() {
    app.innerHTML = st.phase === 'setup' ? setupView() : st.phase === 'play' ? '<div class="wrap">' + boardView() + '</div>' : st.phase === 'board-done' ? doneView() : endView();
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('button'); if (!el) return;
    if (el.dataset.lv) { st.level = el.dataset.lv; render(); }
    else if (el.dataset.nt) { st.nTeams = Number(el.dataset.nt); render(); }
    else if (el.dataset.fk) { st.fakes = el.dataset.fk === 'auto' ? 'auto' : Number(el.dataset.fk); render(); }
    else if (el.dataset.bd) { st.boards = Number(el.dataset.bd); render(); }
    else if (el.dataset.card) pick(Number(el.dataset.card));
    else switch (el.dataset.act) {
      case 'start': launch(); break;
      case 'again': start(); break;
      case 'finish': endGame(false); break;
      case 'setup': st.phase = 'setup'; render(); break;
      case 'ok': closePanel(); break;
      case 'key': st.pending.showKey = true; render(); break;
      case 'saved': judge(true); break;
      case 'lost': judge(false); break;
      case 'next': nextBoard(); break;
      case 'end': endGame(st.phase === 'play'); break;
    }
  });
  app.addEventListener('input', function (e) { var i = e.target.dataset && e.target.dataset.tn; if (i != null) st.names[Number(i)] = e.target.value; });
  window.addEventListener('pagehide', function () { if (st.phase === 'play' && st.found + st.missed > 0) endGame(false, true); });
  render();
})();
</script>
</body>
</html>
