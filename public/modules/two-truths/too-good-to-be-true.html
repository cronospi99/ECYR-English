<style>
:root { --bg:#1D0A39; --card:#22134B; --line:#3E2C7A; --ink:#F6F2FF; --dim:#B3A6D9; --blue:#3D8BFF; --red:#FF4D5E; --green:#2BD67B; --gold:#FFC83D; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { overflow-x: hidden; background: radial-gradient(120% 90% at 82% -10%, #3A1C6E 0%, #1D0A39 46%, var(--bg) 100%); color: var(--ink); font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
h1, h2, .big { font-family: 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -0.02em; }
.wrap { max-width: 1180px; margin: 0 auto; padding: clamp(14px, 3vw, 36px); padding-top: 64px; }
.kicker { font-weight: 800; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
h1 { font-size: clamp(36px, 6vw, 78px); line-height: .95; margin: 8px 0 12px; }
h1 span { color: var(--red); }
p.lead { color: #C8D1E0; font-size: clamp(15px, 1.5vw, 19px); max-width: 760px; line-height: 1.45; margin: 0 0 22px; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin: 18px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 10px 18px; font-weight: 800; font-size: 16px; }
.chip.on { background: var(--blue); border-color: var(--blue); }
.btn { border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 800; font-size: 18px; background: var(--red); color: #fff; box-shadow: 0 6px 0 #8E1E2A; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #8E1E2A; }
.btn.ghost { background: transparent; border: 2px solid var(--line); box-shadow: none; color: var(--ink); font-size: 15px; padding: 9px 16px; }
.btn.green { background: var(--green); color: #052; box-shadow: 0 6px 0 #148A4C; }
.btn.small { font-size: 15px; padding: 10px 18px; }
input.team { background: var(--card); border: 2px solid var(--line); color: var(--ink); border-radius: 12px; padding: 9px 12px; font: 700 15px inherit; width: 150px; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 26px; }
.how div { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; color: #C8D1E0; font-size: 14.5px; line-height: 1.4; }
.how b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.meta .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--ink); }
.meta .imp { background: var(--red); color: #fff; border-color: var(--red); }
.teams { display: flex; flex-wrap: wrap; gap: 8px; }
.team-box { border: 2px solid var(--line); border-radius: 14px; padding: 6px 12px; min-width: 110px; background: var(--card); }
.team-box.turn { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,200,61,.25); }
.team-box .n { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.team-box .s { font-family: 'Bricolage Grotesque'; font-size: 26px; font-weight: 800; line-height: 1; }
.turnline { font-size: clamp(16px, 1.8vw, 22px); font-weight: 700; margin: 4px 0 12px; color: #C8D1E0; }
.turnline b { color: var(--gold); }
.chip.tog { display: inline-flex; align-items: center; gap: 8px; }
.chip.tog i { font-style: normal; font-size: 12px; letter-spacing: .12em; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.14); }
.chip.tog.on { background: #2A1A66; border-color: var(--gold); }
.chip.tog.on i { background: var(--gold); color: #2a1d00; }
.stake { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
.stake .lbl { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-right: 2px; }
.stake .bet { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; }
.stake .bet.on { background: var(--gold); border-color: var(--gold); color: #2a1d00; }
.stake .bet.all.on { background: var(--red); border-color: var(--red); color: #fff; }
.stake .bet:disabled { opacity: .35; cursor: default; }
.stake .now { margin-left: auto; font-weight: 800; font-size: 15px; color: #C8D1E0; }
.stake .now b { color: var(--green); } .stake .now s { color: var(--red); text-decoration: none; font-weight: 800; }
@keyframes multpop { 0% { transform: scale(.4) rotate(-14deg); opacity: 0; } 60% { transform: scale(1.25) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(-4deg); } }
.mult { display: inline-block; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 20px; line-height: 1; padding: 6px 12px; border-radius: 12px; background: var(--gold); color: #2a1d00;
  box-shadow: 0 4px 0 #a36a00; transform: rotate(-4deg); animation: multpop .5s cubic-bezier(.2, .9, .3, 1.3) both; }
.mult.hot { background: var(--red); color: #fff; box-shadow: 0 4px 0 #8E1E2A; }
.card .t b { color: var(--gold); font-weight: 700; }
.card .t em { display: block; font-style: normal; opacity: .85; }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 1.2vw, 14px); }
.card { position: relative; min-height: clamp(76px, 13vh, 120px); border-radius: 18px; border: 2px solid var(--line); background: linear-gradient(160deg, #2C1A5E, #1A0E3C);
  color: var(--ink); padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: transform .12s, border-color .12s; }
.card:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--blue); }
.card .w { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(17px, 2.1vw, 30px); overflow-wrap: anywhere; line-height: 1.05; }
.card .t { font-size: clamp(11px, 1.05vw, 14px); color: var(--dim); margin-top: 4px; }
.card.fake { background: linear-gradient(160deg, #5A0F1A, #2A0910); border-color: var(--red); }
.card.real { background: linear-gradient(160deg, #0E3B25, #0A2218); border-color: var(--green); }
.card.sel { border-color: var(--gold); transform: scale(1.03); }
.card .tag { position: absolute; top: 6px; right: 8px; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
.card:disabled { cursor: default; }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
.card.flip { animation: pop .35s ease-out; }

.panel { margin-top: 14px; background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px 18px; }
.panel.bad { border-color: var(--gold); }
.panel.good { border-color: var(--red); }
.panel h2 { margin: 0 0 6px; font-size: clamp(20px, 2.4vw, 30px); }
.panel p { margin: 4px 0 12px; color: #C8D1E0; }
.key { color: var(--gold); font-weight: 700; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: 10px 0 14px; }
.list div { background: #1A0E3C; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 14px; }
.list .x { border-color: var(--red); }

/* ---- front page: logo + options on the left, the animated scene on the right ---- */
.hero { display: grid; grid-template-columns: minmax(340px, 38%) 1fr; align-items: center; gap: 0; min-height: min(100vh, 860px); padding: 56px 0 10px clamp(16px, 4vw, 64px); }
.hero .col { position: relative; z-index: 2; min-width: 0; }
.hero .logo { display: block; width: min(100%, 520px); height: auto; margin: 2px 0 2px -22px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
.hero p.lead { max-width: 520px; margin-bottom: 4px; font-size: clamp(14px, 1.25vw, 17px); }
.hero .label { margin: 12px 0 6px; }
.hero .chip { padding: 7px 15px; font-size: 15px; }
.hero .chip.wide { padding-inline: 13px; }
.btn.play { margin-top: 20px; font-size: clamp(20px, 2vw, 26px); padding: 14px 34px 14px 26px; background: linear-gradient(180deg, #FF4F7B, #F0245C); box-shadow: 0 7px 0 #9C1340, 0 14px 30px rgba(240,36,92,.35); display: inline-flex; align-items: center; gap: 12px; }
.btn.play:active { transform: translateY(4px); box-shadow: 0 3px 0 #9C1340; }
.btn.play::before { content: ''; border-style: solid; border-width: 13px 0 13px 21px; border-color: transparent transparent transparent #fff; }
.scene { position: relative; width: 100%; aspect-ratio: 1250 / 811; align-self: center; user-select: none; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 17%), linear-gradient(180deg, transparent 0, #000 9%, #000 90%, transparent);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(90deg, transparent 0, #000 17%), linear-gradient(180deg, transparent 0, #000 9%, #000 90%, transparent); mask-composite: intersect; }
.scene img { position: absolute; display: block; }
.scene .base { inset: 0; width: 100%; height: 100%; }
.scene .grp { position: absolute; inset: 0; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012, 1.02); } }
@keyframes think { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.01, 1.016) rotate(-.7deg); } }
@keyframes floaty { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.8%) rotate(1.1deg); } }
@keyframes floatyB { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(2.2%) rotate(-1.3deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-1.7deg); } 50% { transform: rotate(2.3deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.12) rotate(4deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1.2%) scale(1.01); } }
.grp-blue { transform-origin: 29.5% 88%; animation: breathe 3.8s ease-in-out infinite; }
.ly-mag { transform-origin: 25% 78%; animation: sway 4.6s ease-in-out infinite; }
.ly-red { transform-origin: 50% 100%; animation: think 4.4s ease-in-out -1.2s infinite; }
.ly-purple { transform-origin: 50% 100%; animation: breathe 5.2s ease-in-out -2s infinite; }
.ly-green { transform-origin: 50% 100%; animation: breathe 4.7s ease-in-out -.8s infinite; }
.ly-card1 { animation: floaty 4.3s ease-in-out infinite; }
.ly-card2 { animation: floatyB 5.1s ease-in-out -1.5s infinite; }
.ly-card3 { animation: floaty 3.7s ease-in-out -2.2s infinite; }
.ly-emoji { transform-origin: 50% 70%; animation: bob 3.1s ease-in-out infinite; }
.ly-sparkL, .ly-sparkR { animation: pulse 1.5s ease-in-out infinite; }
.ly-sparkR { animation-delay: -.7s; }
.ly-qm { transform-origin: 40% 80%; animation: pulse 2.6s ease-in-out -.4s infinite; }
/* Start: the mind-blown emoji really blows, the screen goes white, the board appears. */
@keyframes boom { 0% { transform: scale(1); } 18% { transform: scale(.9, .86) translateY(3%); } 32% { transform: scale(1.12) rotate(-5deg); } 44% { transform: scale(1.05) rotate(5deg); } 100% { transform: scale(2.3) translateY(-6%); } }
@keyframes shake { 0%, 100% { transform: translate(0); } 20% { transform: translate(-7px, 4px); } 40% { transform: translate(6px, -5px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(4px, 5px); } }
@keyframes puff { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--s)); opacity: 0; } }
.scene.boom .ly-emoji { animation: boom .95s cubic-bezier(.3, .1, .3, 1) forwards; z-index: 5; }
.hero.boom { animation: shake .45s linear .3s; }
.puff { position: absolute; left: 49.6%; top: 14%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #E9DDF6 70%); opacity: 0; animation: puff .8s cubic-bezier(.2, .6, .3, 1) .28s forwards; z-index: 6; }
.puff.spark { width: 2.2%; background: #FFD23D; box-shadow: 0 0 12px #FFB300; }
#flash, #fade { position: fixed; inset: 0; z-index: 9000; pointer-events: none; opacity: 0; }
#flash { background: #fff; transition: opacity .45s ease-in; }
#fade { background: #000; transition: opacity .6s ease; }
#flash.on, #fade.on { opacity: 1; pointer-events: auto; }
#flash.out { transition: opacity .7s ease-out; }
#fade.out { transition: opacity 1s ease-out; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; padding: 60px 16px 0; min-height: 0; } .hero .logo { margin-left: -12px; width: min(100%, 420px); }
  .scene { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 12%, #000 88%, transparent); mask-image: linear-gradient(180deg, transparent 0, #000 12%, #000 88%, transparent); margin-top: 8px; } }

/* ---- the end: winner on a podium ---- */
.end { text-align: center; }
.end h1 { margin-top: 6px; }
.pod { display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px, 2vw, 22px); margin: 26px auto 8px; max-width: 860px; min-height: 330px; }
.pod .p { flex: 1 1 0; max-width: 210px; display: flex; flex-direction: column; align-items: center; }
.pod .nm { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(16px, 2.2vw, 26px); overflow-wrap: anywhere; line-height: 1.05; }
.pod .sc { color: var(--gold); font-weight: 800; font-size: clamp(15px, 1.8vw, 22px); margin: 2px 0 8px; }
.pod .st { font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }
.pod .medal { font-size: clamp(34px, 5vw, 60px); line-height: 1; margin-bottom: 4px; }
@keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes drop { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: none; } }
.pod .blk { width: 100%; border-radius: 16px 16px 0 0; transform-origin: bottom; animation: rise .7s cubic-bezier(.2, .9, .3, 1.15) both; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px;
  font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(30px, 4vw, 52px); color: rgba(255,255,255,.92); box-shadow: inset 0 6px 0 rgba(255,255,255,.22); }
.pod .info { animation: drop .5s ease-out both; }
.pod .r1 .blk { height: 210px; background: linear-gradient(180deg, #FFC83D, #E08A00); animation-delay: 1.5s; } .pod .r1 .info { animation-delay: 2.1s; }
.pod .r2 .blk { height: 150px; background: linear-gradient(180deg, #C9D3E6, #8491AD); animation-delay: .9s; } .pod .r2 .info { animation-delay: 1.4s; }
.pod .r3 .blk { height: 108px; background: linear-gradient(180deg, #E79A62, #A85A28); animation-delay: .4s; } .pod .r3 .info { animation-delay: .9s; }
.pod .r4 .blk { height: 70px; background: linear-gradient(180deg, #5B4A99, #3B2C73); animation-delay: .1s; } .pod .r4 .info { animation-delay: .5s; }
.podfloor { height: 8px; max-width: 900px; margin: 0 auto 18px; border-radius: 99px; background: linear-gradient(90deg, transparent, #6C56C2, transparent); }
@keyframes confetti { 0% { transform: translateY(-10vh) rotate(0); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: .9; } }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti i { position: absolute; top: 0; width: 10px; height: 16px; border-radius: 3px; animation: confetti linear both; }
details.rev { text-align: left; margin: 6px 0 16px; } details.rev summary { cursor: pointer; font-weight: 800; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
.end .row { justify-content: center; }
/* ---- teams on both sides of the board, the team on turn lit up ---- */
.arena { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) minmax(150px, 220px); gap: clamp(10px, 1.6vw, 22px); align-items: start; }
.arena.solo { grid-template-columns: minmax(0, 1fr); }
.side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 64px; }
.tm { --tc: var(--blue); position: relative; border: 3px solid var(--line); border-radius: 20px; padding: 14px 14px 12px; background: var(--card); transition: transform .25s, opacity .25s, box-shadow .25s; opacity: .5; filter: saturate(.55); }
.tm.c0 { --tc: #3D8BFF; } .tm.c1 { --tc: #FF4D5E; } .tm.c2 { --tc: #2BD67B; } .tm.c3 { --tc: #FFC83D; }
.tm .tn { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(17px, 1.7vw, 24px); line-height: 1.05; color: var(--tc); overflow-wrap: anywhere; }
.tm .ts { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(30px, 3.2vw, 46px); line-height: 1; margin: 6px 0 8px; }
.tm .ts small { font-size: 13px; color: var(--dim); font-family: 'Instrument Sans'; font-weight: 700; margin-left: 4px; }
.tm ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.tm li { font-weight: 700; font-size: 15px; padding: 5px 9px; border-radius: 10px; color: #D9D1F2; overflow-wrap: anywhere; }
.tm li.me { background: var(--tc); color: #12062e; }
.tm.on { opacity: 1; filter: none; border-color: var(--tc); transform: scale(1.04); box-shadow: 0 0 0 5px color-mix(in srgb, var(--tc) 30%, transparent), 0 0 46px color-mix(in srgb, var(--tc) 55%, transparent); animation: tmGlow 1.6s ease-in-out infinite; }
.tm .flag { display: none; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--tc); color: #12062e; font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.tm.on .flag { display: block; animation: flagBob 1s ease-in-out infinite; }
.side.l .tm.on::after, .side.r .tm.on::after { content: ''; position: absolute; top: 50%; margin-top: -16px; border: 16px solid transparent; animation: arrowNudge .8s ease-in-out infinite; }
.side.l .tm.on::after { right: -34px; border-left-color: var(--tc); }
.side.r .tm.on::after { left: -34px; border-right-color: var(--tc); }
@keyframes tmGlow { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--tc) 22%, transparent), 0 0 70px color-mix(in srgb, var(--tc) 70%, transparent); } }
@keyframes flagBob { 50% { transform: translate(-50%, -4px); } }
@keyframes arrowNudge { 50% { translate: var(--nx, 6px) 0; } }
.side.r .tm.on::after { --nx: -6px; }
.banner { --tc: var(--gold); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; padding: 12px 18px; border-radius: 18px; background: color-mix(in srgb, var(--tc) 18%, var(--card)); border: 3px solid var(--tc); text-align: center; animation: bannerIn .35s cubic-bezier(.2, .9, .3, 1.3) both; }
.banner.c0 { --tc: #3D8BFF; } .banner.c1 { --tc: #FF4D5E; } .banner.c2 { --tc: #2BD67B; } .banner.c3 { --tc: #FFC83D; }
.banner .who { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: clamp(20px, 2.6vw, 34px); color: var(--tc); line-height: 1.05; }
.banner .q { font-weight: 700; font-size: clamp(15px, 1.5vw, 19px); color: #E6E0F7; }
@keyframes bannerIn { from { transform: scale(.9); opacity: 0; } }
/* teacher tools: swap a few cards for new ones */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; padding: 10px 14px; border: 2px dashed var(--line); border-radius: 16px; color: var(--dim); font-weight: 700; font-size: 14px; }
.tools .lbl { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; margin-right: 4px; }
.tools button { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; }
.tools button:hover { border-color: var(--gold); }
.tools button:disabled { opacity: .35; cursor: default; }
@keyframes swapIn { 0% { transform: rotateY(90deg) scale(.8); opacity: 0; } 60% { transform: rotateY(-12deg) scale(1.05); opacity: 1; } 100% { transform: none; } }
.card.swapin { animation: swapIn .55s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes swapOut { to { transform: rotateY(90deg) scale(.8); opacity: 0; } }
.card.swapout { animation: swapOut .3s ease-in both; }

<body>
<div id="app"></div>
<div id="flash"></div><div id="fade"></div>
<script>
(function () {
  var LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
  var BANK = window.TGTBT_BANK;
  var SOLO = (function () { try { return new URLSearchParams(location.search).get('mode') === 'solo'; } catch (e) { return false; } })();
  var HIT = 100, MISS = 50;
  var FAKES = ['auto', 3, 4, 5, 6, 8], BOARDS = [1, 2, 3, 4, 5];
  // No bets and no multipliers here (those belong to the Phrasal Verb Roulette): +100 / −50, always.
  var BETS = [0, 50, 100, 200];
  var SCENE = '<img class="base" src="tgtbt/scene.webp" alt=""><img class="ly ly-purple" src="tgtbt/purple.webp" alt="" style="left:0.0%;top:51.541%;width:14.0%;height:37.238%"><img class="ly ly-green" src="tgtbt/green.webp" alt="" style="left:77.92%;top:57.707%;width:20.24%;height:21.578%"><div class="grp grp-blue"><img class="ly ly-blue" src="tgtbt/blue.webp" alt="" style="left:10.64%;top:30.703%;width:37.84%;height:57.83%"><img class="ly ly-mag" src="tgtbt/mag.webp" alt="" style="left:31.04%;top:45.869%;width:16.48%;height:38.964%"></div><img class="ly ly-red" src="tgtbt/red.webp" alt="" style="left:46.64%;top:41.06%;width:33.04%;height:47.472%"><img class="ly ly-card1" src="tgtbt/card1.webp" alt="" style="left:10.88%;top:3.699%;width:24.16%;height:27.25%"><img class="ly ly-card2" src="tgtbt/card2.webp" alt="" style="left:65.52%;top:3.946%;width:24.08%;height:27.99%"><img class="ly ly-card3" src="tgtbt/card3.webp" alt="" style="left:67.68%;top:30.333%;width:20.8%;height:18.866%"><img class="ly ly-sparkL" src="tgtbt/sparkL.webp" alt="" style="left:30.16%;top:27.127%;width:8.24%;height:13.687%"><img class="ly ly-sparkR" src="tgtbt/sparkR.webp" alt="" style="left:61.36%;top:22.935%;width:8.24%;height:14.673%"><img class="ly ly-qm" src="tgtbt/qm.webp" alt="" style="left:74.16%;top:44.513%;width:15.76%;height:19.605%"><img class="ly ly-emoji" src="tgtbt/emoji.webp" alt="" style="left:33.84%;top:0.0%;width:31.6%;height:48.212%">';
  var flash = document.getElementById('flash'), fade = document.getElementById('fade');
  var app = document.getElementById('app');

  var st = { phase: 'setup', level: 'B1', nTeams: SOLO ? 1 : 2, names: ['Team A', 'Team B', 'Team C', 'Team D'],
    members: ['', '', '', ''], fakes: 'auto', boards: 3, wagerOn: false, multOn: false, mult: 1, wager: 0, teams: [], turn: 0, board: 0, cards: [], pending: null, used: {}, rep: null, found: 0, missed: 0 };
  try { var saved = JSON.parse(localStorage.getItem('tgtbt:setup') || 'null'); if (saved) { st.level = saved.level || st.level; st.nTeams = SOLO ? 1 : saved.nTeams || 2; st.names = saved.names || st.names;
    if (FAKES.indexOf(saved.fakes) >= 0) st.fakes = saved.fakes; if (BOARDS.indexOf(saved.boards) >= 0) st.boards = saved.boards;
    if (!Array.isArray(st.names) || st.names.length < 4) st.names = ['Team A', 'Team B', 'Team C', 'Team D'];
    if (Array.isArray(saved.members) && saved.members.length === 4) st.members = saved.members.map(function (m) { return String(m || ''); }); } } catch (e) {}
  function parseMembers(s) { return String(s || '').split(/[,;\n]+/).map(function (x) { return x.trim(); }).filter(function (x) { return x; }).slice(0, 12); }

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function parseReal(s) { var p = s.split('|'); return { word: p[0], es: p[1], syn: p[2] || '' }; }
  // Pick fresh words first; once a list runs out, it is reused.
  function take(list, n, key) {
    var used = st.used[key] || (st.used[key] = {});
    var fresh = list.filter(function (x) { return !used[x]; });
    if (fresh.length < n) { st.used[key] = used = {}; fresh = list.slice(); }
    var out = shuffle(fresh).slice(0, n);
    out.forEach(function (x) { used[x] = 1; });
    return out;
  }

  // How far into the game a board is (0 → 1): later boards have more impostors and more look-alikes of real words.
  function progress(k) { return st.boards > 1 ? Math.min(1, k / (st.boards - 1)) : 0.6; }
  function impFor(k) { return st.fakes === 'auto' ? Math.round(3 + 4 * progress(k)) : st.fakes; }
  function lastBoard() { return st.board + 1 >= st.boards; }
  function newBoard() {
    var b = BANK[st.level], nImp = impFor(st.board), nAlike = Math.round(nImp * (0.5 + 0.45 * progress(st.board)));
    var alike = take(b.alike, nAlike, st.level + 'a').map(function (s) { var p = s.split('|'); return { word: p[0], fake: true, alikeOf: p[1] }; });
    var fakes = take(b.fake, nImp - alike.length, st.level + 'f').map(function (w) { return { word: w, fake: true }; });
    var real = take(b.real, 16 - nImp, st.level + 'r').map(function (s) { var r = parseReal(s); r.fake = false; return r; });
    st.cards = shuffle(real.concat(fakes, alike)).map(function (c, i) { c.id = i; c.open = false; return c; });
    st.pending = null;
  }
  function impLeft() { return st.cards.filter(function (c) { return c.fake && !c.open; }).length; }
  function nImp() { return st.cards.filter(function (c) { return c.fake; }).length; }
  // Catch-up balance, as in the roulette: a team far behind rolls bigger multipliers, a runaway leader none.
  function standing(i) {
    var vals = st.teams.map(function (t) { return t.score; });
    var top = Math.max.apply(null, vals), low = Math.min.apply(null, vals);
    if (st.teams.length < 2 || top <= 0) return 'normal';
    var far = function (v) { return top - v > top * 0.75; };
    if (vals[i] === top && far(low)) return 'leader';
    return far(vals[i]) ? 'trailing' : 'normal';
  }
  function rollMult() {
    st.wager = 0;
    if (!st.multOn) { st.mult = 1; return; }
    var s = standing(st.turn), r = Math.random();
    st.mult = s === 'leader' ? 1 : s === 'trailing' ? (r < 0.35 ? 1 : r < 0.55 ? 2 : r < 0.7 ? 3 : r < 0.87 ? 4 : 5) : (r < 0.6 ? 1 : r < 0.85 ? 2 : 3);
  }
  function betOk(v) { var t = st.teams[st.turn]; return v === 0 || (v <= t.score && !(standing(st.turn) === 'leader' && v > HIT)); }
  function gain() { return HIT * st.mult + st.wager; }
  function loss() { return MISS * st.mult + st.wager; }
  function nextTurn() { st.turn = (st.turn + 1) % st.teams.length; rollMult(); }

  function start() {
    try { localStorage.setItem('tgtbt:setup', JSON.stringify({ level: st.level, nTeams: st.nTeams, names: st.names, members: st.members, fakes: st.fakes, boards: st.boards })); } catch (e) {}
    st.teams = []; for (var i = 0; i < st.nTeams; i++) st.teams.push({ name: (st.names[i] || '').trim() || 'Team ' + 'ABCD'[i], members: st.nTeams > 1 ? parseMembers(st.members[i]) : [], mi: 0, score: 0, hits: 0, misses: 0 });
    if (st.nTeams === 1) st.teams[0].name = SOLO ? 'You' : 'The class';
    st.turn = 0; st.board = 0; st.used = {}; st.found = 0; st.missed = 0;
    newBoard(); st.phase = 'play'; rollMult();
    st.rep = { t0: Date.now() };
    window.ECYRBridge && window.ECYRBridge.start({ level: st.level, mode: SOLO ? 'solo' : 'class', meta: { teams: st.nTeams, boards: st.boards, fakes: st.fakes, game: 'impostor-words' } });
    render();
  }

  // One rule: an impostor is +100, a real word is −50.
  function pick(id) {
    var c = st.cards[id]; if (!c || c.open || st.pending) return;
    var team = st.teams[st.turn], pts = c.fake ? gain() : loss(), mult = st.mult, bet = st.wager;
    c.open = true; c.flip = true;
    if (c.fake) { team.score += pts; team.hits++; st.found++; }
    else { team.score -= pts; team.misses++; st.missed++; }
    window.ECYRBridge && window.ECYRBridge.answer(c.fake, { topic: 'impostor', level: st.level });
    st.pending = { kind: c.fake ? 'hit' : 'real', card: c, team: st.turn, who: curMember(team), pts: pts, mult: mult, bet: bet };
    if (team.members.length) team.mi = (team.mi + 1) % team.members.length;
    nextTurn();
    render();
  }
  function curMember(t) { return t && t.members.length ? t.members[t.mi % t.members.length] : ''; }
  // Teacher tool: n unopened cards (real or impostor, at random) leave the board and new ones take
  // their place. Each new card is of the same kind as the one it replaces, so the board keeps its balance.
  function swapCards(n) {
    if (st.pending) return;
    var closed = st.cards.filter(function (c) { return !c.open; });
    var out = n === 'all' ? closed : shuffle(closed).slice(0, Math.min(n, closed.length));
    if (!out.length) return;
    var b = BANK[st.level];
    var onBoard = {}; st.cards.forEach(function (c) { onBoard[c.word.toLowerCase()] = 1; });
    var fresh = function (list, key, mk) { for (var k = 0; k < 6; k++) { var c = mk(take(list, 1, key)[0]); if (!onBoard[c.word.toLowerCase()]) { onBoard[c.word.toLowerCase()] = 1; return c; } } return mk(take(list, 1, key)[0]); };
    out.forEach(function (c) { var el = app.querySelector('[data-card="' + c.id + '"]'); if (el) el.classList.add('swapout'); });
    setTimeout(function () {
      out.forEach(function (old) {
        var nc = !old.fake ? fresh(b.real, st.level + 'r', function (s) { var r = parseReal(s); r.fake = false; return r; })
          : old.alikeOf ? fresh(b.alike, st.level + 'a', function (s) { var p = s.split('|'); return { word: p[0], fake: true, alikeOf: p[1] }; })
          : fresh(b.fake, st.level + 'f', function (w) { return { word: w, fake: true }; });
        nc.id = old.id; nc.open = false; nc.swapin = true;
        st.cards[st.cards.indexOf(old)] = nc;
      });
      render();
    }, 300);
  }
  function closePanel() { st.pending = null; if (!impLeft()) st.phase = 'board-done'; render(); }
  function nextBoard() { st.board++; newBoard(); st.phase = 'play'; rollMult(); render(); }
  function endGame(ask, instant) {
    if (ask && !confirm('End the game now and see the results?')) return;
    if (!instant) { curtain(function () { endGame(false, true); }); return; }
    st.phase = 'end';
    var asked = st.found + st.missed;
    window.ECYRBridge && window.ECYRBridge.end({ mode: SOLO ? 'solo' : 'class', level: st.level, asked: asked, correct: st.found,
      meta: { boards: st.board + 1, teams: st.teams.map(function (t) { return { name: t.name, score: t.score }; }), durationSec: Math.round((Date.now() - st.rep.t0) / 1000), game: 'impostor-words' } });
    render();
  }

  // "Let's play": the emoji's head blows, the screen flashes white and the board is there when it clears.
  var busy = false;
  function boomSound() {
    try {
      if (window.ArcadeMusic && !window.ArcadeMusic.isOn()) return;
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      var c = new AC(), t = c.currentTime + 0.28, o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.5);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.65);
      var b = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      var n = c.createBufferSource(), ng = c.createGain(); n.buffer = b; ng.gain.value = 0.28; n.connect(ng); ng.connect(c.destination); n.start(t);
      setTimeout(function () { c.close(); }, 1600);
    } catch (e) { /* no sound */ }
  }
  function launch() {
    if (busy) return; busy = true;
    var reduce = false;
    var scene = document.getElementById('scene'), hero = document.querySelector('.hero');
    if (!scene || reduce) { start(); busy = false; return; }
    for (var i = 0; i < 22; i++) {
      var a = Math.random() * Math.PI * 2, r = 90 + Math.random() * 260, el = document.createElement('i');
      el.className = 'puff' + (i % 3 === 2 ? ' spark' : '');
      el.style.setProperty('--dx', Math.round(Math.cos(a) * r) + 'px'); el.style.setProperty('--dy', Math.round(Math.sin(a) * r * 0.8 - 60) + 'px');
      el.style.setProperty('--s', (1.4 + Math.random() * 2.4).toFixed(2)); el.style.animationDelay = (0.26 + Math.random() * 0.14).toFixed(2) + 's';
      scene.appendChild(el);
    }
    scene.classList.add('boom'); hero.classList.add('boom'); boomSound();
    setTimeout(function () { flash.className = 'on'; }, 480);
    setTimeout(function () { start(); window.scrollTo(0, 0); flash.className = 'out'; busy = false; }, 980);
  }
  // The end: the screen goes black, then the podium lights up.
  function curtain(then) {
    if (busy) return; busy = true;
    fade.className = 'on';
    setTimeout(function () { then(); window.scrollTo(0, 0); fade.className = 'out'; busy = false; }, 700);
  }

  function setupView() {
    var lv = LEVELS.map(function (l) { return '<button class="chip' + (st.level === l ? ' on' : '') + '" data-lv="' + l + '">' + l + '</button>'; }).join('');
    var tn = SOLO ? '' : '<div class="label">Teams</div><div class="row">' + [1, 2, 3, 4].map(function (n) {
      return '<button class="chip' + (st.nTeams === n ? ' on' : '') + '" data-nt="' + n + '">' + (n === 1 ? 'Whole class' : n + ' teams') + '</button>';
    }).join('') + '</div>' + (st.nTeams > 1 ? '<div class="teamset">' + st.names.slice(0, st.nTeams).map(function (n, i) {
      return '<div><input class="team" data-tn="' + i + '" value="' + esc(n) + '" aria-label="Team ' + (i + 1) + ' name" maxlength="18">' +
        '<input class="team mem" data-tm="' + i + '" value="' + esc(st.members[i]) + '" placeholder="Members: Ana, Luis, Sofi…" aria-label="Team ' + (i + 1) + ' members"></div>';
    }).join('') + '</div>' : '');
    var fk = FAKES.map(function (n) { return '<button class="chip wide' + (st.fakes === n ? ' on' : '') + '" data-fk="' + n + '">' + (n === 'auto' ? 'Rising 3 → 7' : n) + '</button>'; }).join('');
    var bd = BOARDS.map(function (n) { return '<button class="chip' + (st.boards === n ? ' on' : '') + '" data-bd="' + n + '">' + n + '</button>'; }).join('');
    return '<div class="hero"><div class="col"><div class="kicker">Impostor words · English A1 – C2</div>' +
      '<img class="logo" src="tgtbt/logo.webp" width="590" height="258" alt="Too Good to Be True — Impostor Words">' +
      '<p class="lead">16 words appear on the board. Some of them are impostors: invented words, or fakes that look a lot like real English words. Find them all!</p>' +
      '<div class="label">Level</div><div class="row">' + lv + '</div>' + tn +
      '<div class="label">Impostors per board</div><div class="row">' + fk + '</div>' +
      '<div class="label">Boards in this game</div><div class="row">' + bd + '</div>' +
      '<button class="btn play" data-act="start">Let’s play</button></div>' +
      '<div class="scene" id="scene" aria-hidden="true">' + SCENE + '</div></div>' +
      '<div class="wrap" style="padding-top:8px"><div class="how">' +
      '<div><b>1 · Spot an impostor</b>On your turn, tap the word you think is invented. Impostor: +' + HIT + ' points.</div>' +
      '<div><b>2 · A real word costs you</b>If the word is real you lose ' + MISS + ' points. Its Spanish meaning and its synonyms appear, at every level.</div>' +
      '<div><b>3 · The podium</b>A board ends when all its impostors are found; each board hides more look-alikes. After the last one, the winner goes up on the podium.</div>' +
      '</div></div>';
  }

  function teamPanel(t, i) {
    var on = i === st.turn && !st.pending, me = curMember(t);
    var mem = t.members.length ? '<ul>' + t.members.map(function (m, k) { return '<li' + (on && k === t.mi % t.members.length ? ' class="me"' : '') + '>' + (on && k === t.mi % t.members.length ? '▶ ' : '') + esc(m) + '</li>'; }).join('') + '</ul>' : '';
    return '<div class="tm c' + i + (on ? ' on' : '') + '"><span class="flag">' + (me ? esc(me) + '’s turn' : 'Your turn') + '</span><div class="tn">' + esc(t.name) + '</div>' +
      '<div class="ts">' + t.score + '<small>pts</small></div>' + mem + '</div>';
  }
  function boardView() {
    var many = st.teams.length > 1;
    var cards = st.cards.map(function (c) {
      var cls = 'card' + (c.open ? (c.fake ? ' fake' : ' real') : '') + (c.flip ? ' flip' : '') + (c.swapin ? ' swapin' : '') + (st.pending && st.pending.card === c ? ' sel' : '');
      var sub = '';
      if (c.open && c.fake) sub = c.alikeOf ? 'fake · looks like “' + esc(c.alikeOf) + '”' : 'invented';
      else if (c.open) sub = '<b>' + esc(c.es) + '</b>' + (c.syn ? '<em>≈ ' + esc(c.syn) + '</em>' : '');
      return '<button class="' + cls + '" data-card="' + c.id + '"' + (c.open || st.pending ? ' disabled' : '') + '>' +
        (c.open ? '<span class="tag">' + (c.fake ? '🚨' : '✓') + '</span>' : '') +
        '<span class="w">' + esc(c.word) + '</span>' + (sub ? '<span class="t">' + sub + '</span>' : '') + '</button>';
    }).join('');
    st.cards.forEach(function (c) { c.flip = false; c.swapin = false; });
    var t = st.teams[st.turn], me = curMember(t);
    var banner = many
      ? '<div class="banner c' + st.turn + '"><span class="who">' + (me ? esc(me) + ' · ' : '') + esc(t.name) + '</span><span class="q">your turn: which word is an impostor?</span></div>'
      : '<div class="turnline">Which word is an impostor?</div>';
    var closed = st.cards.filter(function (c) { return !c.open; }).length;
    var tools = '<div class="tools"><span class="lbl">🔀 Teacher · new cards</span>' + [2, 4, 6, 8].map(function (n) {
      return '<button data-swap="' + n + '"' + (st.pending || closed < 1 ? ' disabled' : '') + ' title="Swap ' + n + ' random hidden cards for new ones">' + n + '</button>';
    }).join('') + '<button data-swap="all"' + (st.pending || closed < 1 ? ' disabled' : '') + '>All hidden</button></div>';
    var left = '', right = '';
    st.teams.forEach(function (tm, i) { if (i % 2 === 0) left += teamPanel(tm, i); else right += teamPanel(tm, i); });
    var center = (st.pending ? '' : banner) + stakeView() + '<div class="board">' + cards + '</div>' + panelView() + tools;
    return '<div class="top"><div class="meta"><span class="pill">Level ' + st.level + '</span><span class="pill">Board ' + (st.board + 1) + ' of ' + st.boards + '</span>' +
      '<span class="pill imp">' + impLeft() + ' of ' + nImp() + ' impostors left</span></div>' +
      '<div class="row">' + (many ? '' : '<div class="teams">' + st.teams.map(function (tm) { return '<div class="team-box"><div class="n">' + esc(tm.name) + '</div><div class="s">' + tm.score + '</div></div>'; }).join('') + '</div>') +
      '<button class="btn ghost" data-act="end">End game</button></div></div>' +
      (many ? '<div class="arena"><div class="side l">' + left + '</div><div>' + center + '</div><div class="side r">' + right + '</div></div>'

  }

  // The bet bar: optional, never more than the team has; a runaway leader can only bet the basic +100.
  function stakeView() {
    if (st.pending || (!st.wagerOn && st.mult === 1)) return '';
    var t = st.teams[st.turn], out = '<div class="stake">';
    if (st.wagerOn) {
      out += '<span class="lbl">Bet</span>' + BETS.map(function (v) {
        return '<button class="bet' + (st.wager === v ? ' on' : '') + '" data-bet="' + v + '"' + (betOk(v) ? '' : ' disabled') + '>' + (v ? '+' + v : 'No bet') + '</button>';
      }).join('');
      var all = t.score > 0 && betOk(t.score);
      out += '<button class="bet all' + (st.wager === t.score && t.score > 0 && BETS.indexOf(t.score) < 0 ? ' on' : '') + '" data-bet="all"' + (all ? '' : ' disabled') + '>All in</button>';
    }
    return out + '<span class="now">Impostor <b>+' + gain() + '</b> · Real word <s>−' + loss() + '</s></span></div>';
  }

  function panelView() {
    var p = st.pending; if (!p) return '';
    var c = p.card, who = (p.who ? esc(p.who) + ' (' + esc(st.teams[p.team].name) + ')' : esc(st.teams[p.team].name)), many = st.teams.length > 1;
    var how = (p.mult > 1 ? ' ×' + p.mult : '') + (p.bet ? ' + bet ' + p.bet : '');
    var next = '<button class="btn small" data-act="ok">' + (impLeft() ? 'Continue' : 'See the board') + '</button>';
    if (p.kind === 'hit') return '<div class="panel good"><h2>🚨 Impostor caught! +' + p.pts + '</h2><p>“' + esc(c.word) + '” is ' +
      (c.alikeOf ? 'not a real word: it imitates “<b>' + esc(c.alikeOf) + '</b>”.' : 'an invented word.') + (many ? ' Well done, ' + who + '!' : '') +
      (how ? ' <span class="key">(' + HIT + how + ')</span>' : '') + '</p>' + next + '</div>';
    return '<div class="panel bad"><h2>“' + esc(c.word) + '” is a real word! −' + p.pts + '</h2>' +
      '<p>' + (many ? who + ' loses ' : 'You lose ') + p.pts + ' points' + (how ? ' <span class="key">(' + MISS + how + ')</span>' : '') + '.</p>' +
      '<p>In Spanish: <span class="key">' + esc(c.es) + '</span>' + (c.syn ? ' · Synonyms: <span class="key">' + esc(c.syn) + '</span>' : '') + '</p>' + next + '</div>';
  }

  function reviewList() {
    return '<div class="list">' + st.cards.map(function (c) {
      return c.fake ? '<div class="x">🚨 <b>' + esc(c.word) + '</b> — ' + (c.alikeOf ? 'fake (real: ' + esc(c.alikeOf) + ')' : 'invented') + '</div>'
        : '<div>✓ <b>' + esc(c.word) + '</b> — ' + esc(c.es) + '<br><span style="color:#9AA7BD">≈ ' + esc(c.syn) + '</span></div>';
    }).join('') + '</div>';
  }
  function sorted() { return st.teams.slice().sort(function (a, b) { return b.score - a.score; }); }
  function ranking() {
    return '<div class="podium" style="display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 18px">' + sorted().map(function (t, i) {
      return '<div style="background:var(--card);border:2px solid ' + (i ? 'var(--line)' : 'var(--gold)') + ';border-radius:18px;padding:12px 18px;min-width:150px"><div class="kicker" style="color:' + (i ? '#B3A6D9' : '#FFC83D') + '">' + (i ? '#' + (i + 1) : '🏆 #1') + '</div><div class="big" style="font-size:22px;font-weight:800">' + esc(t.name) +
        '</div><div>' + t.score + ' pts · ' + t.hits + ' impostors · ' + t.misses + ' real words</div></div>';
    }).join('') + '</div>';
  }
  function doneView() {
    var next = lastBoard() ? '<button class="btn" data-act="finish">See the winner 🏆</button>'
      : '<button class="btn" data-act="next">Next board (' + (st.board + 2) + ' of ' + st.boards + ') · ' + impFor(st.board + 1) + ' impostors</button><button class="btn ghost" data-act="end">End game</button>';
    return '<div class="wrap"><div class="kicker">Board ' + (st.board + 1) + ' of ' + st.boards + ' complete</div><h1 style="font-size:clamp(30px,4.5vw,56px)">All the impostors are out! 🎉</h1>' +
      ranking() + '<div class="label">The board</div>' + reviewList() + '<div class="row">' + next + '</div></div>';
  }
  function podium() {
    var w = sorted(), medals = ['🏆', '🥈', '🥉', ''];
    // Classic podium order: 2nd, 1st, 3rd (4th at the end).
    var order = w.length === 1 ? [0] : w.length === 2 ? [1, 0] : w.length === 3 ? [1, 0, 2] : [1, 0, 2, 3];
    return '<div class="pod">' + order.map(function (k) {
      var t = w[k];
      return '<div class="p r' + (k + 1) + '"><div class="info"><div class="medal">' + medals[k] + '</div><div class="nm">' + esc(t.name) + '</div><div class="sc">' + t.score + ' pts</div>' +
        '<div class="st">' + t.hits + ' impostors · ' + t.misses + ' real words</div></div><div class="blk">' + (k + 1) + '</div></div>';
    }).join('') + '</div><div class="podfloor"></div>';
  }
  function confetti() {
    var cols = ['#FFC83D', '#FF4D5E', '#3D8BFF', '#2BD67B', '#C77DFF', '#fff'], out = '';
    for (var i = 0; i < 70; i++) out += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + cols[i % cols.length] + ';animation-duration:' + (2.6 + Math.random() * 2.6).toFixed(2) + 's;animation-delay:' + (2 + Math.random() * 2.5).toFixed(2) + 's;animation-iteration-count:3"></i>';
    return '<div class="confetti">' + out + '</div>';
  }
  function endView() {
    var w = sorted();
    var title = st.teams.length === 1 ? 'Great job!' : (w[0].score === w[1].score ? 'It’s a draw!' : esc(w[0].name) + ' wins!');
    var played = Math.min(st.board + 1, st.boards);
    return confetti() + '<div class="wrap end"><div class="kicker">Level ' + st.level + ' · ' + played + (played > 1 ? ' boards' : ' board') + ' · ' + st.found + ' impostors caught</div>' +
      '<h1 style="font-size:clamp(32px,5vw,64px)">' + title + '</h1>' + podium() +
      '<details class="rev"><summary>The last board: words, Spanish and synonyms</summary>' + reviewList() + '</details>' +
      '<div class="row"><button class="btn" data-act="again">Play again</button><button class="btn ghost" data-act="setup">Change level, teams or boards</button></div></div>';
  }

  function render() {
    app.innerHTML = st.phase === 'setup' ? setupView() : st.phase === 'play' ? '<div class="wrap" style="max-width:1560px">' + boardView() + '</div>' : st.phase === 'board-done' ? doneView() : endView();
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('button'); if (!el) return;
    if (el.dataset.lv) { st.level = el.dataset.lv; render(); }
    else if (el.dataset.nt) { st.nTeams = Number(el.dataset.nt); render(); }
    else if (el.dataset.fk) { st.fakes = el.dataset.fk === 'auto' ? 'auto' : Number(el.dataset.fk); render(); }
    else if (el.dataset.bd) { st.boards = Number(el.dataset.bd); render(); }
    else if (el.dataset.tog) { st[el.dataset.tog] = !st[el.dataset.tog]; render(); }
    else if (el.dataset.bet) { var v = el.dataset.bet === 'all' ? st.teams[st.turn].score : Number(el.dataset.bet); if (betOk(v)) { st.wager = st.wager === v && v ? 0 : v; render(); } }
    else if (el.dataset.card) pick(Number(el.dataset.card));
    else if (el.dataset.swap) swapCards(el.dataset.swap === 'all' ? 'all' : Number(el.dataset.swap));
    else switch (el.dataset.act) {
      case 'start': launch(); break;
      case 'again': start(); break;
      case 'finish': endGame(false); break;
      case 'setup': st.phase = 'setup'; render(); break;
      case 'ok': closePanel(); break;
      case 'next': nextBoard(); break;
      case 'end': endGame(st.phase === 'play'); break;
    }
  });
  app.addEventListener('input', function (e) {
    var d = e.target.dataset || {};
    if (d.tn != null) st.names[Number(d.tn)] = e.target.value;
    if (d.tm != null) st.members[Number(d.tm)] = e.target.value;
  });
  window.addEventListener('pagehide', function () { if (st.phase === 'play' && st.found + st.missed > 0) endGame(false, true); });
  render();
})();
</script>
</body>
</html>
