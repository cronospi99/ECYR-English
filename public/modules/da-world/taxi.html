<!doctype html>
<html lang="en" data-app="taxi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, minimal-ui, viewport-fit=cover" />
    <meta name="description" content="Taxi Rush: race a sports taxi through a huge city, understand where every passenger wants to go and answer at the traffic lights." />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%9A%95%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Russo+One&display=swap" />
    <title>Taxi Rush</title>
    <style>
      /* Taxi Rush's own loading screen: night asphalt, taxi yellow, checkered flags. */
      html[data-app="taxi"] body { background: #0b0b0c; }
      html[data-app="taxi"] #loader {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; color: #fff;
        background:
          radial-gradient(80% 60% at 50% 38%, rgba(255, 210, 26, .22), transparent 65%),
          repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 2px, transparent 2px 9px),
          linear-gradient(180deg, #1a1b20 0%, #0b0b0c 70%);
        transition: opacity .6s ease;
      }
      html[data-app="taxi"] #loader.is-hidden { opacity: 0; pointer-events: none; }
      html[data-app="taxi"] #loader::before, html[data-app="taxi"] #loader::after {
        content: ""; position: absolute; left: 0; right: 0; height: 18px;
        background: repeating-conic-gradient(#0b0b0c 0 25%, #f4f4f4 0 50%) 0 0 / 18px 18px;
      }
      html[data-app="taxi"] #loader::before { top: 0; }
      html[data-app="taxi"] #loader::after { bottom: 0; }
      .tr-road { position: absolute; left: 50%; bottom: 0; width: 140vmax; height: 46vh; transform: translateX(-50%) perspective(420px) rotateX(62deg); transform-origin: 50% 100%;
        background: linear-gradient(90deg, transparent 0 46%, #ffd21a 46% 47%, transparent 47% 53%, #ffd21a 53% 54%, transparent 54%),
                    repeating-linear-gradient(180deg, transparent 0 60px, rgba(255,255,255,.85) 60px 110px) 50% 0 / 18px 100% no-repeat,
                    linear-gradient(180deg, #121316, #1c1d22);
        animation: trRoad .5s linear infinite; opacity: .9; }
      @keyframes trRoad { to { background-position: 0 0, 50% 110px, 0 0; } }
      .tr-streak { position: absolute; height: 3px; width: 26vw; background: linear-gradient(90deg, transparent, #ffd21a); border-radius: 2px; opacity: .0; animation: trStreak 1.1s linear infinite; }
      @keyframes trStreak { 0% { transform: translateX(-30vw); opacity: 0; } 20% { opacity: .9; } 100% { transform: translateX(130vw); opacity: 0; } }
      .tr-center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 26px; padding: 0 16px; margin-top: -10vh; }
      .tr-logo { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 7px; transform: skewX(-11deg); filter: drop-shadow(0 12px 0 rgba(0,0,0,.45)); animation: trIn .9s cubic-bezier(.2,1.4,.4,1) both; }
      @keyframes trIn { from { transform: translateX(-60vw) skewX(-25deg); } to { transform: skewX(-11deg); } }
      .tr-word { display: flex; align-items: center; }
      .tr-taxi { position: relative; font: 400 clamp(72px, 14vw, 170px)/.84 'Racing Sans One', 'Russo One', 'Arial Black', sans-serif; color: #ffd21a; -webkit-text-stroke: 3px #0b0b0c; paint-order: stroke fill; text-shadow: 6px 6px 0 #000, 12px 12px 0 #e8384f; padding-right: .1em; }
      .tr-taxi::before { content: ""; position: absolute; right: 100%; top: 20%; width: .9em; height: 60%; margin-right: .08em; background: repeating-linear-gradient(180deg, #ffd21a 0 8px, transparent 8px 17px); -webkit-mask: linear-gradient(90deg, transparent, #000); mask: linear-gradient(90deg, transparent, #000); }
      .tr-rush { font: 400 clamp(36px, 6.5vw, 84px)/1 'Russo One', 'Arial Black', sans-serif; color: #0b0b0c; background: linear-gradient(#ffe24a, #ffc400); padding: .12em .38em .1em; border: 4px solid #000; border-radius: 10px; box-shadow: 6px 6px 0 #000; letter-spacing: .08em; margin-left: .18em; }
      .tr-flag { width: 100%; height: 16px; border: 2px solid #000; background: repeating-conic-gradient(#0b0b0c 0 25%, #f4f4f4 0 50%) 0 0 / 16px 16px; }
      .tr-flag-b { width: 72%; }
      .tr-tag { font: 400 clamp(12px, 1.6vw, 17px) 'Russo One', sans-serif; letter-spacing: .34em; color: #ffd21a; background: #000; padding: 6px 14px; border-radius: 4px; }
      html[data-app="taxi"] #loader .loader-track { position: relative; width: min(520px, 80vw); height: 16px; border: 3px solid #ffd21a; border-radius: 10px; background: #000; overflow: visible; transform: skewX(-11deg); }
      html[data-app="taxi"] #loader .loader-bar { position: relative; height: 100%; width: 0; border-radius: 6px; background: repeating-linear-gradient(135deg, #ffd21a 0 12px, #f0b400 12px 24px); transition: width .25s ease; }
      html[data-app="taxi"] #loader .loader-bar::after { content: "🚕"; position: absolute; right: -22px; top: -30px; font-size: 32px; transform: skewX(11deg) scaleX(-1); }
      html[data-app="taxi"] #loader .loader-note { margin: 0; font: 400 15px 'Russo One', sans-serif; letter-spacing: .18em; color: #c9cbd3; text-transform: uppercase; }
      html[data-app="taxi"] #loader .loader-error { color: #ffd21a; font: 400 16px 'Russo One', sans-serif; text-align: center; }
    </style>
    <script src="/modules/_bridge/ecyr-bridge.js" data-slug="taxi-rush"></script>
    <script type="module" crossorigin src="/modules/da-world/assets/taxi-BQs21JHO.js"></script>
    <link rel="modulepreload" crossorigin href="/modules/da-world/assets/mode-Dxhf1ULB.js">
    <link rel="stylesheet" crossorigin href="/modules/da-world/assets/mode-DAta7E2n.css">
  </head>
  <body>
    <div id="app">
      <div id="loader">
        <div class="tr-road"></div>
        <i class="tr-streak" style="top:18%;animation-delay:-.2s"></i>
        <i class="tr-streak" style="top:31%;animation-delay:-.7s;width:18vw"></i>
        <i class="tr-streak" style="top:62%;animation-delay:-.45s"></i>
        <i class="tr-streak" style="top:74%;animation-delay:-.9s;width:34vw"></i>
        <div class="tr-center">
          <div class="tr-logo" aria-label="Taxi Rush">
            <div class="tr-flag"></div>
            <div class="tr-word"><span class="tr-taxi">TAXI</span><span class="tr-rush">RUSH</span></div>
            <div class="tr-flag tr-flag-b"></div>
            <div class="tr-tag">★ CITY FARE RACING ★</div>
          </div>
          <div class="loader-track"><div id="loaderBar" class="loader-bar"></div></div>
          <p class="loader-note">Warming up the engine…</p>
        </div>
      </div>
    </div>
  </body>
</html>
